components:
  schemas:
    BetaGatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaUnrestrictedNetwork:
      properties:
        type:
          type: string
          const: unrestricted
          title: Type
          description: Network policy type
      additionalProperties: false
      type: object
      required:
      - type
      title: UnrestrictedNetwork
      description: Unrestricted network access.
    BetaOverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
          default: overloaded_error
          title: Type
          type: string
      required:
      - message
      - type
      title: OverloadedError
      type: object
    BetaBillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    BetaSelfHostedWorkStopRequest:
      properties:
        force:
          type: boolean
          title: Force
          description: If true, immediately stop work without graceful shutdown
          default: false
      type: object
      title: SelfHostedWorkStopRequest
      description: Request to stop a work item.
    BetaSelfHostedWork:
      properties:
        acknowledged_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Acknowledged At
          description: RFC 3339 timestamp when the work item was acknowledged and assigned to a self-hosted sandbox
        created_at:
          type: string
          title: Created At
          description: RFC 3339 timestamp when work was created
        data:
          $ref: '#/components/schemas/BetaSessionWorkData'
          description: The actual work to be performed
        environment_id:
          type: string
          title: Environment Id
          description: Environment identifier this work belongs to (e.g., `env_...`)
        id:
          type: string
          title: Id
          description: Work identifier (e.g., 'work_...')
        latest_heartbeat_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Heartbeat At
          description: RFC 3339 timestamp of the most recent heartbeat
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
          description: User-provided metadata key-value pairs associated with this work item
        secret:
          anyOf:
          - type: string
          - type: 'null'
          title: Secret
          description: Credential payload used by the environment worker to execute this work item. May be populated when polling for work; null on all other retrieval paths.
        started_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Started At
          description: RFC 3339 timestamp when work execution started
        state:
          type: string
          enum:
          - queued
          - starting
          - active
          - stopping
          - stopped
          title: State
          description: Current state of the work item
        stop_requested_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Stop Requested At
          description: RFC 3339 timestamp when stop was requested
        stopped_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Stopped At
          description: RFC 3339 timestamp when work execution stopped
        type:
          type: string
          const: work
          title: Type
          description: The type of object (always 'work')
          default: work
      type: object
      required:
      - acknowledged_at
      - created_at
      - data
      - environment_id
      - id
      - latest_heartbeat_at
      - metadata
      - secret
      - started_at
      - state
      - stop_requested_at
      - stopped_at
      - type
      title: SelfHostedWork
      description: 'Work resource representing a unit of work in a self-hosted environment.


        Work items are queued when sessions are created or when long-dormant sessions

        receive new messages. The environment worker polls for work to execute in a

        self-hosted sandbox.'
    BetaSelfHostedWorkHeartbeatResponse:
      properties:
        last_heartbeat:
          type: string
          title: Last Heartbeat
          description: RFC 3339 timestamp of the actual heartbeat from DB
        lease_extended:
          type: boolean
          title: Lease Extended
          description: Whether the heartbeat succeeded in extending the lease
        state:
          type: string
          enum:
          - queued
          - starting
          - active
          - stopping
          - stopped
          title: State
          description: Current state of the work item (active/stopping/stopped)
        ttl_seconds:
          type: integer
          title: Ttl Seconds
          description: Effective TTL applied to the lease
        type:
          type: string
          const: work_heartbeat
          title: Type
          description: The type of response
          default: work_heartbeat
      type: object
      required:
      - last_heartbeat
      - lease_extended
      - state
      - ttl_seconds
      - type
      title: SelfHostedWorkHeartbeatResponse
      description: Response after recording a heartbeat for a work item.
    BetaAuthenticationError:
      properties:
        message:
          default: Authentication error
          title: Message
          type: string
        type:
          const: authentication_error
          default: authentication_error
          title: Type
          type: string
      required:
      - message
      - type
      title: AuthenticationError
      type: object
    BetaNotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    BetaCloudConfigParams:
      properties:
        networking:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/BetaUnrestrictedNetwork'
            - $ref: '#/components/schemas/BetaLimitedNetworkParams'
              x-anthropic-beta-required:
              - managed-agents-2026-04-01
            discriminator:
              propertyName: type
              mapping:
                limited: '#/components/schemas/BetaLimitedNetworkParams'
                unrestricted: '#/components/schemas/BetaUnrestrictedNetwork'
          - type: 'null'
          title: Networking
          description: Network configuration policy. Omit on update to preserve the existing value.
          examples:
          - type: limited
            allowed_hosts:
            - api.example.com
            allow_package_managers: true
        packages:
          anyOf:
          - $ref: '#/components/schemas/BetaPackagesParams'
          - type: 'null'
          description: Package manager configuration. Under `limited` networking, requires `networking.allow_package_managers` to be `true`. Omit on update to preserve the existing value.
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
          examples:
          - pip:
            - pandas
            - numpy
        type:
          type: string
          const: cloud
          title: Type
          description: Environment type
          examples:
          - cloud
      additionalProperties: false
      type: object
      required:
      - type
      title: CloudConfigParams
      description: 'Request params for `cloud` environment configuration.


        Fields default to null; on update, omitted fields preserve the

        existing value.'
      example:
        type: cloud
        networking:
          type: limited
          allowed_hosts:
          - api.example.com
          allow_package_managers: true
        packages:
          pip:
          - pandas
          - numpy
    BetaPublicEnvironmentUpdateRequest:
      properties:
        config:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/BetaCloudConfigParams'
            - $ref: '#/components/schemas/BetaSelfHostedConfigParams'
              x-anthropic-beta-required:
              - managed-agents-2026-04-01
            discriminator:
              propertyName: type
              mapping:
                cloud: '#/components/schemas/BetaCloudConfigParams'
                self_hosted: '#/components/schemas/BetaSelfHostedConfigParams'
          - type: 'null'
          title: Config
          description: Updated environment configuration
        description:
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
          title: Description
          description: Updated description of the environment. Omit to preserve; null clears to null; an empty string is stored as an empty string.
          examples:
          - Python environment with data-analysis packages.
        metadata:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          type: object
          title: Metadata
          description: User-provided metadata key-value pairs. Set a value to null or empty string to delete the key.
        name:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 1
          - type: 'null'
          title: Name
          description: Updated name for the environment
        scope:
          anyOf:
          - type: string
            enum:
            - organization
            - account
          - type: 'null'
          title: Scope
          description: The visibility scope for this environment. 'organization' makes the environment visible to all accounts. 'account' restricts visibility to the owning account only.
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
      additionalProperties: false
      type: object
      title: PublicEnvironmentUpdateRequest
      description: Public API request to update an environment (without org/account fields).
      example:
        description: Python environment with data-analysis packages.
    BetaCloudConfig:
      properties:
        networking:
          oneOf:
          - $ref: '#/components/schemas/BetaUnrestrictedNetwork'
          - $ref: '#/components/schemas/BetaLimitedNetwork'
            x-anthropic-beta-required:
            - managed-agents-2026-04-01
          title: Networking
          description: Network configuration policy.
          discriminator:
            propertyName: type
            mapping:
              limited: '#/components/schemas/BetaLimitedNetwork'
              unrestricted: '#/components/schemas/BetaUnrestrictedNetwork'
          examples:
          - type: limited
            allowed_hosts:
            - api.example.com
            allow_package_managers: true
            allow_mcp_servers: false
        packages:
          $ref: '#/components/schemas/BetaPackages'
          description: Package manager configuration.
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
          examples:
          - type: packages
            pip:
            - pandas
            - numpy
            npm: []
            apt: []
            cargo: []
            gem: []
            go: []
        type:
          type: string
          const: cloud
          title: Type
          description: Environment type
          examples:
          - cloud
      type: object
      required:
      - networking
      - packages
      - type
      title: CloudConfig
      description: '`cloud` environment configuration.'
      example:
        type: cloud
        networking:
          type: limited
          allowed_hosts:
          - api.example.com
          allow_package_managers: true
          allow_mcp_servers: false
        packages:
          type: packages
          pip:
          - pandas
          - numpy
          npm: []
          apt: []
          cargo: []
          gem: []
          go: []
    BetaEnvironment:
      properties:
        archived_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived At
          description: RFC 3339 timestamp when environment was archived, or null if not archived
          examples:
          - null
        config:
          oneOf:
          - $ref: '#/components/schemas/BetaCloudConfig'
          - $ref: '#/components/schemas/BetaSelfHostedConfig'
            x-anthropic-beta-required:
            - managed-agents-2026-04-01
          title: Config
          description: Environment configuration (either Anthropic Cloud or self-hosted)
          discriminator:
            propertyName: type
            mapping:
              cloud: '#/components/schemas/BetaCloudConfig'
              self_hosted: '#/components/schemas/BetaSelfHostedConfig'
          examples:
          - type: cloud
            networking:
              type: limited
              allowed_hosts:
              - api.example.com
              allow_package_managers: true
              allow_mcp_servers: false
            packages:
              type: packages
              pip:
              - pandas
              - numpy
              npm: []
              apt: []
              cargo: []
              gem: []
              go: []
        created_at:
          type: string
          title: Created At
          description: RFC 3339 timestamp when environment was created
          examples:
          - '2026-03-15T10:00:00Z'
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: User-provided description for the environment; null when unset
          examples:
          - Python environment with data-analysis packages.
        id:
          type: string
          title: Id
          description: Environment identifier (e.g., 'env_...')
          examples:
          - env_011CZkZ9X2dpNyB7HsEFoRfW
        metadata:
          additionalProperties:
            type: string
          type: object
          title: Metadata
          description: User-provided metadata key-value pairs
          examples:
          - key: value
        name:
          type: string
          title: Name
          description: Human-readable name for the environment
          examples:
          - python-data-analysis
        scope:
          type: string
          enum:
          - organization
          - account
          title: Scope
          description: The visibility scope for this environment. 'organization' means visible to all accounts. 'account' means visible only to the owning account.
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
        type:
          type: string
          const: environment
          title: Type
          description: The type of object (always 'environment')
          default: environment
          examples:
          - environment
        updated_at:
          type: string
          title: Updated At
          description: RFC 3339 timestamp when environment was last updated
          examples:
          - '2026-03-15T10:00:00Z'
      type: object
      required:
      - archived_at
      - config
      - created_at
      - description
      - id
      - metadata
      - name
      - type
      - updated_at
      title: Environment
      description: Unified Environment resource for both cloud and self-hosted environments.
