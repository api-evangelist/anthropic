openapi: 3.2.0
info:
  title: Anthropic Models API
servers:
- url: https://api.anthropic.com
tags:
- name: Models
paths:
  /v1/models:
    get:
      summary: List Models
      description: 'List available models.


        The Models API response can be used to determine which models are available for use in the API. More recently released models are listed first.'
      operationId: models_list
      parameters:
      - name: before_id
        in: query
        required: false
        schema:
          type: string
          description: ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately before this object.
          title: Before Id
        description: ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately before this object.
      - name: after_id
        in: query
        required: false
        schema:
          type: string
          description: ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately after this object.
          title: After Id
        description: ID of the object to use as a cursor for pagination. When provided, returns the page of results immediately after this object.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: 'Number of items to return per page.


            Defaults to `20`. Ranges from `1` to `1000`.'
          default: 20
          title: Limit
        description: 'Number of items to return per page.


          Defaults to `20`. Ranges from `1` to `1000`.'
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
          description: 'The version of the Claude API you want to use.


            Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
          title: Anthropic-Version
        description: 'The version of the Claude API you want to use.


          Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
      - name: anthropic-beta
        in: header
        required: false
        schema:
          type: string
          items:
            type: string
          description: 'Optional header to specify the beta version(s) you want to use.


            To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.'
          title: Anthropic-Beta
          x-stainless-override-schema:
            x-stainless-param: betas
            x-stainless-extend-default: true
            type: array
            description: Optional header to specify the beta version(s) you want to use.
            items:
              $ref: '#/components/schemas/AnthropicBeta'
        description: 'Optional header to specify the beta version(s) you want to use.


          To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.'
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: 'Your unique API key for authentication.


            This key is required in the header of all API requests, to authenticate your account and access Anthropic''s services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace.'
          title: X-Api-Key
        description: 'Your unique API key for authentication.


          This key is required in the header of all API requests, to authenticate your account and access Anthropic''s services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse_ModelInfo_'
        4XX:
          description: 'Error response.


            See our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Models
  /v1/models/{model_id}:
    get:
      summary: Get a Model
      description: 'Get a specific model.


        The Models API response can be used to determine information about a specific model or resolve a model alias to a model ID.'
      operationId: models_get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          description: Model identifier or alias.
          title: Model Id
        description: Model identifier or alias.
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
          description: 'The version of the Claude API you want to use.


            Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
          title: Anthropic-Version
        description: 'The version of the Claude API you want to use.


          Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
      - name: anthropic-beta
        in: header
        required: false
        schema:
          type: string
          items:
            type: string
          description: 'Optional header to specify the beta version(s) you want to use.


            To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.'
          title: Anthropic-Beta
          x-stainless-override-schema:
            x-stainless-param: betas
            x-stainless-extend-default: true
            type: array
            description: Optional header to specify the beta version(s) you want to use.
            items:
              $ref: '#/components/schemas/AnthropicBeta'
        description: 'Optional header to specify the beta version(s) you want to use.


          To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.'
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: 'Your unique API key for authentication.


            This key is required in the header of all API requests, to authenticate your account and access Anthropic''s services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace.'
          title: X-Api-Key
        description: 'Your unique API key for authentication.


          This key is required in the header of all API requests, to authenticate your account and access Anthropic''s services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelInfo'
        4XX:
          description: 'Error response.


            See our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      tags:
      - Models
  /v1/models/{model_id}?beta=true:
    get:
      summary: Get a Model
      description: 'Get a specific model.


        The Models API response can be used to determine information about a specific model or resolve a model alias to a model ID.'
      operationId: beta_models_get
      parameters:
      - name: model_id
        in: path
        required: true
        schema:
          type: string
          description: Model identifier or alias.
          title: Model Id
        description: Model identifier or alias.
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
          description: 'The version of the Claude API you want to use.


            Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
          title: Anthropic-Version
        description: 'The version of the Claude API you want to use.


          Read more about versioning and our version history [here](https://platform.claude.com/docs/en/api/versioning).'
      - name: anthropic-beta
        in: header
        required: false
        schema:
          type: string
          items:
            type: string
          description: 'Optional header to specify the beta version(s) you want to use.


            To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.'
          title: Anthropic-Beta
          x-stainless-override-schema:
            x-stainless-param: betas
            x-stainless-extend-default: true
            type: array
            description: Optional header to specify the beta version(s) you want to use.
            items:
              $ref: '#/components/schemas/AnthropicBeta'
        description: 'Optional header to specify the beta version(s) you want to use.


          To use multiple betas, use a comma separated list like `beta1,beta2` or specify the header multiple times for each beta.'
      - name: x-api-key
        in: header
        required: false
        schema:
          type: string
          description: 'Your unique API key for authentication.


            This key is required in the header of all API requests, to authenticate your account and access Anthropic''s services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace.'
          title: X-Api-Key
        description: 'Your unique API key for authentication.


          This key is required in the header of all API requests, to authenticate your account and access Anthropic''s services. Get your API key through the [Console](https://console.anthropic.com/settings/keys). Each key is scoped to a Workspace.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaModelInfo'
        4XX:
          description: 'Error response.


            See our [errors documentation](https://platform.claude.com/docs/en/api/errors) for more details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BetaErrorResponse'
      tags:
      - Models
components:
  schemas:
    BetaGatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaOverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
          default: overloaded_error
          title: Type
          type: string
      required:
      - message
      - type
      title: OverloadedError
      type: object
    BetaBillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    RateLimitError:
      properties:
        message:
          default: Rate limited
          title: Message
          type: string
        type:
          const: rate_limit_error
          default: rate_limit_error
          title: Type
          type: string
      required:
      - message
      - type
      title: RateLimitError
      type: object
    PermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
    BetaCapabilitySupport:
      properties:
        supported:
          type: boolean
          title: Supported
          description: Whether this capability is supported by the model.
      type: object
      required:
      - supported
      title: CapabilitySupport
      description: Indicates whether a capability is supported.
    NotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    BetaAuthenticationError:
      properties:
        message:
          default: Authentication error
          title: Message
          type: string
        type:
          const: authentication_error
          default: authentication_error
          title: Type
          type: string
      required:
      - message
      - type
      title: AuthenticationError
      type: object
    BillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    BetaNotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    ErrorResponse:
      properties:
        error:
          discriminator:
            mapping:
              api_error: '#/components/schemas/APIError'
              authentication_error: '#/components/schemas/AuthenticationError'
              billing_error: '#/components/schemas/BillingError'
              invalid_request_error: '#/components/schemas/InvalidRequestError'
              not_found_error: '#/components/schemas/NotFoundError'
              overloaded_error: '#/components/schemas/OverloadedError'
              permission_error: '#/components/schemas/PermissionError'
              rate_limit_error: '#/components/schemas/RateLimitError'
              timeout_error: '#/components/schemas/GatewayTimeoutError'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/InvalidRequestError'
          - $ref: '#/components/schemas/AuthenticationError'
          - $ref: '#/components/schemas/BillingError'
          - $ref: '#/components/schemas/PermissionError'
          - $ref: '#/components/schemas/NotFoundError'
          - $ref: '#/components/schemas/RateLimitError'
          - $ref: '#/components/schemas/GatewayTimeoutError'
          - $ref: '#/components/schemas/APIError'
          - $ref: '#/components/schemas/OverloadedError'
          title: Error
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Request Id
        type:
          const: error
          default: error
          title: Type
          type: string
      required:
      - error
      - request_id
      - type
      title: ErrorResponse
      type: object
    ThinkingCapability:
      properties:
        supported:
          type: boolean
          title: Supported
          description: Whether this capability is supported by the model.
        types:
          $ref: '#/components/schemas/ThinkingTypes'
      type: object
      required:
      - supported
      - types
      title: ThinkingCapability
      description: Thinking capability details.
    BetaEffortCapability:
      properties:
        high:
          $ref: '#/components/schemas/BetaCapabilitySupport'
          description: Whether the model supports high effort level.
        low:
          $ref: '#/components/schemas/BetaCapabilitySupport'
          description: Whether the model supports low effort level.
        max:
          $ref: '#/components/schemas/BetaCapabilitySupport'
          description: Whether the model supports max effort level.
        medium:
          $ref: '#/components/schemas/BetaCapabilitySupport'
          description: Whether the model supports medium effort level.
        supported:
          type: boolean
          title: Supported
          description: Whether this capability is supported by the model.
        xhigh:
          anyOf:
          - $ref: '#/components/schemas/BetaCapabilitySupport'
          - type: 'null'
          description: Whether the model supports xhigh effort level.
      type: object
      required:
      - high
      - low
      - max
      - medium
      - supported
      - xhigh
      title: EffortCapability
      description: Effort (reasoning_effort) capability details.
    GatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaInvalidRequestError:
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          const: invalid_request_error
          default: invalid_request_error
          title: Type
          type: string
      required:
      - message
      - type
      title: InvalidRequestError
      type: object
    BetaPermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
    ModelInfo:
      properties:
        capabilities:
          anyOf:
          - $ref: '#/components/schemas/ModelCapabilities'
          - type: 'null'
          description: Object mapping capability names to their support details. Keys are always present for all known capabilities.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: RFC 3339 datetime string representing the time at which the model was released. May be set to an epoch value if the release date is unknown.
          examples:
          - '2026-07-24T00:00:00Z'
        display_name:
          type: string
          title: Display Name
          description: A human-readable name for the model.
          examples:
          - Claude Opus 5
        id:
          type: string
          title: Id
          description: Unique model identifier.
          examples:
          - claude-opus-5
        max_input_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Input Tokens
          description: Maximum input context window size in tokens for this model.
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: Maximum value for the `max_tokens` parameter when using this model.
        type:
          type: string
          const: model
          title: Type
          description: 'Object type.


            For Models, this is always `"model"`.'
          default: model
      type: object
      required:
      - capabilities
      - created_at
      - display_name
      - id
      - max_input_tokens
      - max_tokens
      - type
      title: ModelInfo
    ListResponse_ModelInfo_:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ModelInfo'
          type: array
          title: Data
        first_id:
          anyOf:
          - type: string
          - type: 'null'
          title: First Id
          description: First ID in the `data` list. Can be used as the `before_id` for the previous page.
        has_more:
          type: boolean
          title: Has More
          description: Indicates if there are more results in the requested page direction.
        last_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Id
          description: Last ID in the `data` list. Can be used as the `after_id` for the next page.
      type: object
      required:
      - data
      - first_id
      - has_more
      - last_id
      title: ListResponse[ModelInfo]
    APIError:
      properties:
        message:
          default: Internal server error
          title: Message
          type: string
        type:
          const: api_error
          default: api_error
          title: Type
          type: string
      required:
      - message
      - type
      title: APIError
      type: object
    ContextManagementCapability:
      properties:
        clear_thinking_20251015:
          anyOf:
          - $ref: '#/components/schemas/CapabilitySupport'
          - type: 'null'
          description: Whether the clear_thinking_20251015 strategy is supported.
        clear_tool_uses_20250919:
          anyOf:
          - $ref: '#/components/schemas/CapabilitySupport'
          - type: 'null'
          description: Whether the clear_tool_uses_20250919 strategy is supported.
        compact_20260112:
          anyOf:
          - $ref: '#/components/schemas/CapabilitySupport'
          - type: 'null'
          description: Whether the compact_20260112 strategy is supported.
        supported:
          type: boolean
          title: Supported
          description: Whether this capability is supported by the model.
      type: object
      required:
      - clear_thinking_20251015
      - clear_tool_uses_20250919
      - compact_20260112
      - supported
      title: ContextManagementCapability
      description: Context management capability details.
    ThinkingTypes:
      properties:
        adaptive:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports thinking with type 'adaptive' (auto).
        enabled:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports thinking with type 'enabled'.
      type: object
      required:
      - adaptive
      - enabled
      title: ThinkingTypes
      description: Supported thinking type configurations.
    BetaModelInfo:
      properties:
        allowed_fallback_models:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed Fallback Models
          description: Model IDs this model accepts as `fallbacks[i].model` on the Messages API. An empty list means the `fallbacks` parameter is not supported for this model as primary.
          x-anthropic-beta-required:
          - server-side-fallback-2026-06-01
          - server-side-fallback-2026-07-01
        capabilities:
          anyOf:
          - $ref: '#/components/schemas/BetaModelCapabilities'
          - type: 'null'
          description: Object mapping capability names to their support details. Keys are always present for all known capabilities.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: RFC 3339 datetime string representing the time at which the model was released. May be set to an epoch value if the release date is unknown.
          examples:
          - '2026-07-24T00:00:00Z'
        display_name:
          type: string
          title: Display Name
          description: A human-readable name for the model.
          examples:
          - Claude Opus 5
        id:
          type: string
          title: Id
          description: Unique model identifier.
          examples:
          - claude-opus-5
        max_input_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Input Tokens
          description: Maximum input context window size in tokens for this model.
        max_tokens:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Tokens
          description: Maximum value for the `max_tokens` parameter when using this model.
        type:
          type: string
          const: model
          title: Type
          description: 'Object type.


            For Models, this is always `"model"`.'
          default: model
      type: object
      required:
      - allowed_fallback_models
      - capabilities
      - created_at
      - display_name
      - id
      - max_input_tokens
      - max_tokens
      - type
      title: ModelInfo
    EffortCapability:
      properties:
        high:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports high effort level.
        low:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports low effort level.
        max:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports max effort level.
        medium:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports medium effort level.
        supported:
          type: boolean
          title: Supported
          description: Whether this capability is supported by the model.
        xhigh:
          anyOf:
          - $ref: '#/components/schemas/CapabilitySupport'
          - type: 'null'
          description: Whether the model supports xhigh effort level.
      type: object
      required:
      - high
      - low
      - max
      - medium
      - supported
      - xhigh
      title: EffortCapability
      description: Effort (reasoning_effort) capability details.
    ModelCapabilities:
      properties:
        batch:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports the Batch API.
        citations:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports citation generation.
        code_execution:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports code execution tools.
        context_management:
          $ref: '#/components/schemas/ContextManagementCapability'
          description: Context management support and available strategies.
        effort:
          $ref: '#/components/schemas/EffortCapability'
          description: Effort (reasoning_effort) support and available levels.
        image_input:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model accepts image content blocks.
        pdf_input:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model accepts PDF content blocks.
        structured_outputs:
          $ref: '#/components/schemas/CapabilitySupport'
          description: Whether the model supports structured output / JSON mode / strict tool schemas.
        thinking:
          $ref: '#/components/schemas/ThinkingCapability'
          description: Thinking capability and supported type configurations.
      type: object
      required:
      - batch
      - citations
      - code_execution
      - context_management
      - effort
      - image_input
      - pdf_input
      - structured_outputs
      - thinking
      title: ModelCapabilities
      description: Model capability information.
    BetaContextManagementCapability:
      properties:
        clear_thinking_20251015:
          anyOf:
          - $ref: '#/components/schemas/BetaCapabilitySupport'
          - type: 'null'
          description: Whether the clear_thinking_20251015 strategy is supported.
        clear_tool_uses_20250919:
          anyOf:
          - $ref: '#/components/schemas/BetaCapabilitySupport'
          - type: 'null'
          description: Whether the clear_tool_uses_20250919 strategy is supported.
        compact_20260112:
          anyOf:
          - $ref: '#/components/schemas/BetaCapabilitySupport'
          - type: 'null'
          description: Whether the compact_20260112 strategy is supported.
        supported:
          type: boolean
          title: Supported
          description: Whether this capability is supported by the model.
      type: object
      required:
      - clear_thinking_20251015
      - clear_tool_uses_20250919
      - compact_20260112
      - supported
      title: ContextManagementCapability
      description: Context management capability details.
    InvalidRequestError:
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          const: invalid_request_error
          default: invalid_request_error
          title: Type
          type: string
      required:
      - message
      - type
      title: InvalidRequestError
      type: object
    OverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
