    BetaManagedAgentsDeployment:
      description: 'A deployment is a configured instance of an agent — it binds the agent to everything needed to run it autonomously: an environment, credentials, initial events, and an optional schedule.'
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - name
      - description
      - agent
      - environment_id
      - vault_ids
      - initial_events
      - resources
      - metadata
      - schedule
      - status
      - paused_reason
      - created_at
      - updated_at
      - archived_at
      properties:
        type:
          type: string
          enum:
          - deployment
          examples:
          - deployment
        id:
          description: Unique identifier for this deployment.
          type: string
          examples:
          - depl_011CZkZcDH3vPqd7xnEfwTai
        name:
          description: Human-readable name.
          type: string
          examples:
          - Daily order report
        description:
          description: Description of what the deployment does.
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Compiles yesterday's orders into a report every weekday morning.
        agent:
          description: Reference to the agent this deployment runs, resolved to a concrete version.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsAgentReference'
          examples:
          - type: agent
            id: agent_011CZkYpogX7uDKUyvBTophP
            version: 1
        environment_id:
          description: ID of the `environment` where sessions run.
          type: string
          examples:
          - env_011CZkZ9X2dpNyB7HsEFoRfW
        vault_ids:
          description: Vault IDs supplying stored credentials for sessions created from this deployment.
          type: array
          items:
            type: string
          examples:
          - - vlt_011CZkZDLs7fYzm1hXNPeRjv
        initial_events:
          description: Events sent to each session immediately after creation.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsDeploymentInitialEvent'
          examples:
          - - type: user.message
              content:
              - type: text
                text: Compile yesterday's orders into report.md.
        resources:
          description: Resources attached to sessions created from this deployment. Echoes the input minus write-only credentials.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsSessionResourceConfig'
          examples:
          - []
        metadata:
          description: Arbitrary key-value metadata. Maximum 16 pairs.
          type: object
          additionalProperties:
            type: string
          examples:
          - {}
        schedule:
          description: Recurring cron schedule. Presence enables scheduled execution; null means manual-only. Includes computed timestamps (next fire times, last run) on the cron variant.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsSchedule'
          - type: 'null'
          examples:
          - type: cron
            expression: 0 9 * * 1-5
            timezone: America/Los_Angeles
            last_run_at: '2026-03-16T16:00:09Z'
            upcoming_runs_at:
            - '2026-03-17T16:00:00Z'
            - '2026-03-18T16:00:00Z'
        status:
          description: 'Computed status of the deployment: `active` or `paused`. Archived deployments report `active` with `archived_at` set.'
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsDeploymentStatus'
          examples:
          - active
        paused_reason:
          description: Why the deployment is paused. Non-null exactly when status is paused; null otherwise.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsDeploymentPausedReason'
          - type: 'null'
          examples:
          - null
        budget:
          description: Spend ceiling stamped onto each session created from this deployment. Absent when no budget is set.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsBudget'
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
        created_at:
          description: Time the deployment was created.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:00:00Z'
        updated_at:
          description: Time the deployment was last updated.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:00:00Z'
        archived_at:
          description: Time the deployment was archived. Null if not archived.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
          examples:
          - null
      example:
        type: deployment
        id: depl_011CZkZcDH3vPqd7xnEfwTai
        name: Daily order report
        description: Compiles yesterday's orders into a report every weekday morning.
        agent:
          type: agent
          id: agent_011CZkYpogX7uDKUyvBTophP
          version: 1
        environment_id: env_011CZkZ9X2dpNyB7HsEFoRfW
        vault_ids:
        - vlt_011CZkZDLs7fYzm1hXNPeRjv
        initial_events:
        - type: user.message
          content:
          - type: text
            text: Compile yesterday's orders into report.md.
        resources: []
        metadata: {}
        schedule:
          type: cron
          expression: 0 9 * * 1-5
          timezone: America/Los_Angeles
          last_run_at: '2026-03-16T16:00:09Z'
          upcoming_runs_at:
          - '2026-03-17T16:00:00Z'
          - '2026-03-18T16:00:00Z'
        status: active
        paused_reason: null
        created_at: '2026-03-15T10:00:00Z'
        updated_at: '2026-03-15T10:00:00Z'
        archived_at: null
    BetaManagedAgentsSessionResourceParams:
