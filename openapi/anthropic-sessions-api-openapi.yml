      type: object
      additionalProperties: false
      required:
      - type
      - outcome_id
      - description
      - result
      - iteration
      - completed_at
      - explanation
      properties:
        type:
          type: string
          enum:
          - outcome_evaluation
          examples:
          - outcome_evaluation
