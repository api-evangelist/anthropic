    BetaManagedAgentsSessionUsageSnapshot:
      description: Point-in-time snapshot of a session's cumulative usage.
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          description: Total input tokens consumed across all turns.
          type: integer
          format: int32
        output_tokens:
          description: Total output tokens generated across all turns.
          type: integer
          format: int32
        cache_read_input_tokens:
          description: Total tokens read from prompt cache.
          type: integer
          format: int32
        cache_creation:
          description: Tokens used to create prompt cache entries, broken down by cache TTL.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsCacheCreationUsage'
        list_cost:
          description: Cumulative list cost of the session across all turns, priced at public list rates.
          allOf:
          - $ref: '#/components/schemas/BetaMonetaryAmount'
        server_tool_use:
          description: Cumulative server-executed tool usage across all turns.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsServerToolUsage'
        active_seconds:
          description: Cumulative time in seconds during which the session had at least one thread in running status. Overlapping activity from concurrent threads is counted once. This is the duration the session's runtime cost is priced on.
          type: number
          format: double
    BetaManagedAgentsSessionUpdatedEvent:
      description: Emitted when an UpdateSession request changed at least one field. Carries only the fields that changed; absent fields were not part of the update. The new configuration applies from the next turn.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - processed_at
      properties:
        type:
          type: string
          enum:
          - session.updated
        id:
          description: Unique identifier for this event.
          type: string
        processed_at:
          description: Timestamp when the update was applied.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
        title:
          description: The session's new title. Present only when the update changed it.
          anyOf:
          - type: string
          - type: 'null'
        metadata:
          description: The session's full metadata bag after the update. Present when the update set non-empty metadata; absent when metadata was unchanged or cleared to empty.
          type: object
          additionalProperties:
            type: string
        agent:
          description: The session's effective agent configuration after the update. Present only when the update changed `agent` (tools or mcp_servers); when present it is the full materialised snapshot, not a diff.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsSessionAgent'
          - type: 'null'
        budget:
          description: 'The session''s budget after the update: the new budget when set or replaced, or null when the update removed it. Present only when the update changed the budget.'
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsBudget'
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
