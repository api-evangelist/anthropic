      description: Configuration for tools from an MCP server defined in `mcp_servers`.
      type: object
      additionalProperties: false
      required:
      - type
      - mcp_server_name
      properties:
        type:
          type: string
          enum:
          - mcp_toolset
        mcp_server_name:
          description: Name of the MCP server. Must match a server name from the mcp_servers array. 1-255 characters.
          type: string
          minLength: 1
          maxLength: 255
        default_config:
          description: Default configuration for all tools from this server.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsMCPToolsetDefaultConfigParams'
          - type: 'null'
        configs:
          description: Per-tool configuration overrides.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsMCPToolConfigParams'
    BetaManagedAgentsAgentToolResultEvent:
      description: Event representing the result of an agent tool execution.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - tool_use_id
      - processed_at
      properties:
        type:
          type: string
          enum:
          - agent.tool_result
        id:
          description: Unique identifier for this event.
          type: string
        tool_use_id:
          description: The id of the `agent.tool_use` event this result corresponds to.
          type: string
        content:
          description: The result content returned by the tool.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsToolResultContentBlock'
        is_error:
          description: Whether the tool execution resulted in an error.
          anyOf:
          - type: boolean
          - type: 'null'
        processed_at:
          description: Timestamp when this event was processed.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
    BetaManagedAgentsUserDefineOutcomeEvent:
      description: Echo of a `user.define_outcome` input event. Carries the server-generated `outcome_id` that subsequent `span.outcome_evaluation_*` events reference.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - processed_at
      - outcome_id
      - description
      - max_iterations
      - rubric
      properties:
        type:
          type: string
          enum:
          - user.define_outcome
          examples:
          - user.define_outcome
        id:
          description: Unique identifier for this event.
          type: string
          examples:
          - sevt_011CZkZSTx3lFgt7odUWmkyq
        processed_at:
          description: Timestamp when the outcome was accepted.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:02:14Z'
        outcome_id:
          description: Server-generated `outc_` ID for this outcome. Referenced by `span.outcome_evaluation_*` events and the session's `outcome_evaluations` list.
          type: string
          examples:
          - outc_011CZkZRSw2kEfs6ncTVljxP
        description:
          description: What the agent should produce. Copied from the input event.
          type: string
          examples:
          - Produce a 2-page summary as summary.md
        max_iterations:
          description: Evaluate-then-revise cycles before giving up. Default 3, max 20.
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
          examples:
          - 3
        rubric:
          description: How to grade the outcome. File rubrics are currently resolved to their text content; clients should handle both variants.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsRubric'
          examples:
          - type: text
            content: Must cover all five sections; cite sources inline.
      example:
        type: user.define_outcome
        id: sevt_011CZkZSTx3lFgt7odUWmkyq
        processed_at: '2026-03-15T10:02:14Z'
        outcome_id: outc_011CZkZRSw2kEfs6ncTVljxP
        description: Produce a 2-page summary as summary.md
        max_iterations: 3
        rubric:
          type: text
          content: Must cover all five sections; cite sources inline.
    BetaManagedAgentsModelRateLimitedError:
      description: The model request was rate-limited.
      type: object
      additionalProperties: false
      required:
      - type
      - message
      - retry_status
      properties:
        type:
          type: string
          enum:
          - model_rate_limited_error
        message:
          description: Human-readable error description.
          type: string
        retry_status:
          description: What the client should do next.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsRetryStatus'
    BetaManagedAgentsSessionStatusRescheduledEvent:
      description: Indicates the session is recovering from an error state and is rescheduled for execution.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - processed_at
      properties:
        type:
          type: string
          enum:
          - session.status_rescheduled
        id:
          description: Unique identifier for this event.
          type: string
        processed_at:
          description: Timestamp of status change.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
    BetaManagedAgentsSessionErrorEvent:
      description: An error event indicating a problem occurred during session execution.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - processed_at
      - error
      properties:
        type:
          type: string
          enum:
          - session.error
        id:
          description: Unique identifier for this event.
          type: string
        processed_at:
          description: Timestamp when the error occurred.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
        error:
          type: object
          discriminator:
            propertyName: type
            mapping:
              unknown_error: '#/components/schemas/BetaManagedAgentsUnknownError'
              model_overloaded_error: '#/components/schemas/BetaManagedAgentsModelOverloadedError'
              model_rate_limited_error: '#/components/schemas/BetaManagedAgentsModelRateLimitedError'
              model_request_failed_error: '#/components/schemas/BetaManagedAgentsModelRequestFailedError'
              mcp_connection_failed_error: '#/components/schemas/BetaManagedAgentsMcpConnectionFailedError'
              mcp_authentication_failed_error: '#/components/schemas/BetaManagedAgentsMcpAuthenticationFailedError'
              billing_error: '#/components/schemas/BetaManagedAgentsBillingError'
              credential_host_unreachable_error: '#/components/schemas/BetaManagedAgentsCredentialHostUnreachableError'
          oneOf:
          - $ref: '#/components/schemas/BetaManagedAgentsUnknownError'
          - $ref: '#/components/schemas/BetaManagedAgentsModelOverloadedError'
          - $ref: '#/components/schemas/BetaManagedAgentsModelRateLimitedError'
          - $ref: '#/components/schemas/BetaManagedAgentsModelRequestFailedError'
          - $ref: '#/components/schemas/BetaManagedAgentsMcpConnectionFailedError'
          - $ref: '#/components/schemas/BetaManagedAgentsMcpAuthenticationFailedError'
          - $ref: '#/components/schemas/BetaManagedAgentsBillingError'
          - $ref: '#/components/schemas/BetaManagedAgentsCredentialHostUnreachableError'
    BetaManagedAgentsSessionUsage:
      description: Cumulative token usage for a session across all turns.
      type: object
      additionalProperties: false
      properties:
        input_tokens:
          description: Total input tokens consumed across all turns.
          type: integer
          format: int32
        output_tokens:
          description: Total output tokens generated across all turns.
          type: integer
          format: int32
        cache_read_input_tokens:
          description: Total tokens read from prompt cache.
          type: integer
          format: int32
        cache_creation:
          description: Tokens used to create prompt cache entries, broken down by cache TTL.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsCacheCreationUsage'
        list_cost:
          description: Cumulative list cost of the session across all turns, priced at public list rates. Absent until cost tracking is available for the session.
          anyOf:
          - $ref: '#/components/schemas/BetaMonetaryAmount'
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
        server_tool_use:
          description: Cumulative server-executed tool usage across all turns. Absent until server-tool tracking is available for the session.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsServerToolUsage'
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
        active_seconds:
          description: Cumulative time in seconds during which the session had at least one thread in running status. Overlapping activity from concurrent threads is counted once, unlike `stats.active_seconds`, which sums each thread's own active time. This is the duration the session's runtime cost is priced on.
          type: number
          format: double
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
    BetaManagedAgentsMCPToolConfig:
      description: Resolved configuration for a specific MCP tool.
      type: object
      additionalProperties: false
      required:
      - name
      - enabled
      - permission_policy
      properties:
        name:
          type: string
        enabled:
          type: boolean
        permission_policy:
          $ref: '#/components/schemas/BetaManagedAgentsPermissionPolicy'
    BetaManagedAgentsAgentMcpToolResultEvent:
      description: Event representing the result of an MCP tool execution.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - mcp_tool_use_id
      - processed_at
      properties:
        type:
          type: string
          enum:
          - agent.mcp_tool_result
        id:
          description: Unique identifier for this event.
          type: string
        mcp_tool_use_id:
          description: The id of the `agent.mcp_tool_use` event this result corresponds to.
          type: string
        content:
          description: The result content returned by the tool.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsToolResultContentBlock'
        is_error:
          description: Whether the tool execution resulted in an error.
          anyOf:
          - type: boolean
          - type: 'null'
        processed_at:
          description: Timestamp when this event was processed.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
    BetaManagedAgentsUserToolConfirmationEvent:
      description: A tool confirmation event that approves or denies a pending tool execution.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - tool_use_id
      - result
      properties:
        type:
          type: string
          enum:
          - user.tool_confirmation
        id:
          description: Unique identifier for this event.
          type: string
        tool_use_id:
          description: The id of the `agent.tool_use` or `agent.mcp_tool_use` event this result corresponds to, which can be found in the last `session.status_idle` [event's](https://platform.claude.com/docs/en/api/beta/sessions/events/list#beta_managed_agents_session_requires_action.event_ids) `stop_reason.event_ids` field.
          type: string
        result:
          description: 'The confirmation result: ''allow'' or ''deny''.'
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsUserToolConfirmationResult'
        deny_message:
          description: Optional message providing context for a 'deny' decision. Only allowed when result is 'deny'.
          anyOf:
          - type: string
            maxLength: 10000
          - type: 'null'
        processed_at:
          description: Timestamp when the confirmation was processed.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
        session_thread_id:
          description: When set, the confirmation routes to this subagent's thread rather than the primary. Echo this from the `session_thread_id` on the `agent.tool_use` or `agent.mcp_tool_use` event that prompted the approval.
          anyOf:
          - type: string
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
    BetaManagedAgentsUserMessageEventParams:
      description: Parameters for sending a user message to the session.
      type: object
      additionalProperties: false
      required:
      - type
      - content
      properties:
        type:
          type: string
          enum:
          - user.message
          examples:
          - user.message
        content:
          description: Array of content blocks for the user message.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsUserContentBlock'
          examples:
          - - type: text
              text: 'Where is my order #1234?'
      example:
        type: user.message
        content:
        - type: text
          text: 'Where is my order #1234?'
    BetaManagedAgentsMCPToolsetDefaultConfig:
      description: Resolved default configuration for all tools from an MCP server.
      type: object
      additionalProperties: false
      required:
      - enabled
      - permission_policy
      properties:
        enabled:
          type: boolean
        permission_policy:
          $ref: '#/components/schemas/BetaManagedAgentsPermissionPolicy'
    BetaManagedAgentsRubric:
      description: Rubric for grading the quality of an outcome.
      discriminator:
        propertyName: type
        mapping:
          file: '#/components/schemas/BetaManagedAgentsFileRubric'
          text: '#/components/schemas/BetaManagedAgentsTextRubric'
      oneOf:
      - $ref: '#/components/schemas/BetaManagedAgentsFileRubric'
      - $ref: '#/components/schemas/BetaManagedAgentsTextRubric'
    BetaManagedAgentsDocumentBlock:
      description: Document content, either specified directly as base64 data, as text, or as a reference via a URL.
      type: object
      additionalProperties: false
      required:
      - type
      - source
      properties:
        type:
          type: string
          enum:
          - document
        source:
          description: The source of the document data.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsDocumentSource'
        title:
          description: The title of the document.
          anyOf:
          - type: string
          - type: 'null'
        context:
          description: Additional context about the document for the model.
          anyOf:
          - type: string
          - type: 'null'
    BetaManagedAgentsUserToolResultEvent:
      description: Event sent by the client providing the result of an agent-toolset tool execution. Only valid on `self_hosted` environments, where sandbox-routed tools are executed by the client rather than the server.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - tool_use_id
      properties:
        type:
          type: string
          enum:
          - user.tool_result
        id:
          description: Unique identifier for this event.
          type: string
        tool_use_id:
          description: The id of the `agent.tool_use` event this result corresponds to, which can be found in the last `session.status_idle` [event's](https://platform.claude.com/docs/en/api/beta/sessions/events/list#beta_managed_agents_session_requires_action.event_ids) `stop_reason.event_ids` field.
          type: string
        content:
          description: The result content returned by the tool.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsToolResultContentBlock'
        is_error:
          description: Whether the tool execution resulted in an error.
          anyOf:
          - type: boolean
          - type: 'null'
        processed_at:
          description: Timestamp when this result was processed.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
        session_thread_id:
          description: Routes this result to a subagent thread. Copy from the `agent.tool_use` event's `session_thread_id`.
          anyOf:
          - type: string
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
    BetaManagedAgentsEventStartEvent_AgentThinkingPreview:
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - agent.thinking
        id:
          description: The id the buffered agent.thinking will carry if it is emitted. Start-only — no event_delta events follow.
          type: string
    BetaManagedAgentsEffortHigh:
      description: High effort. Favors reasoning depth.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - high
    BetaManagedAgentsCredentialHostUnreachableError:
      description: An `environment_variable` credential's `auth.networking.allowed_hosts` includes a host the environment's network policy does not permit.
      type: object
      additionalProperties: false
      required:
      - type
      - message
      - retry_status
      - vault_id
      - credential_id
      properties:
        type:
          type: string
          enum:
          - credential_host_unreachable_error
        message:
          description: Human-readable error description.
          type: string
        retry_status:
          description: What the client should do next.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsRetryStatus'
        vault_id:
          description: ID of the vault containing the affected credential.
          type: string
        credential_id:
          description: ID of the affected credential.
          type: string
    BetaManagedAgentsCustomToolParams:
      description: A custom tool that is executed by the API client rather than the agent. When the agent calls this tool, an `agent.custom_tool_use` event is emitted and the session goes idle, waiting for the client to provide the result via a `user.custom_tool_result` event.
      type: object
      additionalProperties: false
      required:
      - type
      - name
      - description
      - input_schema
      properties:
        type:
          type: string
          enum:
          - custom
        name:
          description: Unique name for the tool. 1-128 characters; letters, digits, underscores, and hyphens.
          type: string
          minLength: 1
          maxLength: 128
        description:
          description: Description of what the tool does, shown to the agent to help it decide when to use the tool.
          type: string
          minLength: 1
        input_schema:
          description: JSON Schema defining the expected input parameters for the tool.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsCustomToolInputSchema'
    BetaManagedAgentsURLImageSource:
      description: Image referenced by URL.
      type: object
      additionalProperties: false
      required:
      - type
      - url
      properties:
        type:
          type: string
          enum:
          - url
        url:
          description: URL of the image to fetch.
          type: string
          minLength: 1
    BetaManagedAgentsBudget:
      description: An enforced spend ceiling on a session. Discriminated on `type`; `limit` is the only kind currently supported.
      type: object
      discriminator:
        propertyName: type
        mapping:
          limit: '#/components/schemas/BetaManagedAgentsBudgetLimit'
      oneOf:
      - $ref: '#/components/schemas/BetaManagedAgentsBudgetLimit'
    BetaManagedAgentsAgentToolset20260401Params:
      description: Configuration for built-in agent tools. Use this to enable or disable groups of tools available to the agent.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - agent_toolset_20260401
        default_config:
          description: Default configuration applied to all tools in this set.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsAgentToolsetDefaultConfigParams'
          - type: 'null'
        configs:
          description: Per-tool configuration overrides.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsAgentToolConfigUnionParams'
    BetaManagedAgentsWriteToolConfig:
      description: Configuration for the write tool.
      type: object
      additionalProperties: false
      required:
      - type
      - name
      - enabled
      - permission_policy
      properties:
        type:
          type: string
          const: write
        name:
          type: string
          const: write
        enabled:
          type: boolean
        permission_policy:
          $ref: '#/components/schemas/BetaManagedAgentsPermissionPolicy'
    BetaManagedAgentsSessionRetriesExhausted:
      description: 'The turn ended because repeated errors exhausted the retry budget or an error escalated to `retry_status: ''exhausted''`.'
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - retries_exhausted
    BetaManagedAgentsModelConfig:
      description: Model identifier and configuration.
      type: object
      additionalProperties: false
      required:
      - id
      properties:
        id:
          $ref: '#/components/schemas/BetaManagedAgentsModel'
        speed:
          description: Inference speed mode. `fast` provides significantly faster output token generation at premium pricing. Defaults to `standard`. Not all models support `fast`; invalid combinations are rejected at create time.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsSpeed'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
          - fast-mode-2026-02-01
          examples:
          - standard
        effort:
          description: How hard Claude works on each inference call. One of `low`, `medium`, `high`, `xhigh`, `max`. Always present; resolved to the per-model default at save time when not supplied.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsEffort'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
        inference_geo:
          description: Geographic region for model inference. When unset, requests fall through to the workspace's default_inference_geo.
          type: string
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
      example:
        id: claude-opus-5
        speed: standard
    BetaManagedAgentsListSessionThreads:
      description: Paginated list of threads within a `session`.
      type: object
      additionalProperties: false
      properties:
        data:
          description: Threads in the session, primary first then children in spawn order.
          x-stainless-pagination-property:
            purpose: items
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsSessionThread'
          examples:
          - - type: session_thread
              id: sthr_011CZkZVWa6oIjw0rgXZpnBt
              session_id: sesn_011CZkZAtmR3yMPDzynEDxu7
              status: idle
              agent:
                type: agent
                id: agent_011CZkYqphY8vELVzwCUpqiQ
                version: 1
                name: Researcher
                description: A focused research subagent.
                model:
                  id: claude-opus-5
                  speed: standard
                system: You are a research subagent that gathers and summarises sources for the coordinating agent.
                tools:
                - type: agent_toolset_20260401
                  default_config:
                    enabled: true
                    permission_policy:
                      type: always_ask
                  configs: []
                mcp_servers: []
                skills: []
              parent_thread_id: null
              created_at: '2026-03-15T10:00:00Z'
              updated_at: '2026-03-15T10:00:00Z'
              archived_at: null
              usage:
                input_tokens: 0
                output_tokens: 0
                cache_read_input_tokens: 0
                cache_creation:
                  ephemeral_5m_input_tokens: 0
                  ephemeral_1h_input_tokens: 0
              stats:
                duration_seconds: 0
                startup_seconds: 0
                active_seconds: 0
        next_page:
          description: Opaque cursor for the next page. Null when no more results.
          x-stainless-pagination-property:
            purpose: next_cursor_field
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - page_MjAyNS0wNS0xNFQwMDowMDowMFo=
      example:
        data:
        - type: session_thread
          id: sthr_011CZkZVWa6oIjw0rgXZpnBt
          session_id: sesn_011CZkZAtmR3yMPDzynEDxu7
          status: idle
          agent:
            type: agent
            id: agent_011CZkYqphY8vELVzwCUpqiQ
            version: 1
            name: Researcher
            description: A focused research subagent.
            model:
              id: claude-opus-5
              speed: standard
            system: You are a research subagent that gathers and summarises sources for the coordinating agent.
            tools:
            - type: agent_toolset_20260401
              default_config:
                enabled: true
                permission_policy:
                  type: always_ask
              configs: []
            mcp_servers: []
            skills: []
          parent_thread_id: null
          created_at: '2026-03-15T10:00:00Z'
          updated_at: '2026-03-15T10:00:00Z'
          archived_at: null
          usage:
            input_tokens: 0
            output_tokens: 0
            cache_read_input_tokens: 0
            cache_creation:
              ephemeral_5m_input_tokens: 0
              ephemeral_1h_input_tokens: 0
          stats:
            duration_seconds: 0
            startup_seconds: 0
            active_seconds: 0
        next_page: page_MjAyNS0wNS0xNFQwMDowMDowMFo=
    BetaManagedAgentsCacheCreationUsage:
      description: Prompt-cache creation token usage broken down by cache lifetime.
      type: object
      additionalProperties: false
      properties:
        ephemeral_1h_input_tokens:
          description: Tokens used to create 1-hour ephemeral cache entries.
          type: integer
          format: int32
        ephemeral_5m_input_tokens:
          description: Tokens used to create 5-minute ephemeral cache entries.
          type: integer
          format: int32
    BetaManagedAgentsEventDeltaType:
      type: string
      description: EventDeltaType enum
      enum:
      - agent.message
      - agent.thinking
    BetaManagedAgentsUpdateSessionResourceParams:
      description: Request parameters for updating a session resource.
      type: object
      additionalProperties: false
      required:
      - authorization_token
      properties:
        authorization_token:
          description: New authorization token for the resource. Currently only `github_repository` resources support token rotation.
          type: string
          minLength: 1
          maxLength: 4096
          examples:
          - ghp_exampletoken
      example:
        authorization_token: ghp_exampletoken
    BetaManagedAgentsPermissionPolicy:
      description: Permission policy for tool execution.
      type: object
      discriminator:
        propertyName: type
        mapping:
          always_allow: '#/components/schemas/BetaManagedAgentsAlwaysAllowPolicy'
