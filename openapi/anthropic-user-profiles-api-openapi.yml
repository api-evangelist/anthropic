components:
  schemas:
    BetaGatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaUserProfileRelationship:
      type: string
      description: 'How the entity behind a user profile relates to the platform that owns the API key. `external`: an individual end-user of the platform. `resold`: a company the platform resells Claude access to. `internal`: the platform''s own usage.'
      enum:
      - external
      - resold
      - internal
    BetaErrorResponse:
      properties:
        error:
          discriminator:
            mapping:
              api_error: '#/components/schemas/BetaAPIError'
              authentication_error: '#/components/schemas/BetaAuthenticationError'
              billing_error: '#/components/schemas/BetaBillingError'
              invalid_request_error: '#/components/schemas/BetaInvalidRequestError'
              not_found_error: '#/components/schemas/BetaNotFoundError'
              overloaded_error: '#/components/schemas/BetaOverloadedError'
              permission_error: '#/components/schemas/BetaPermissionError'
              rate_limit_error: '#/components/schemas/BetaRateLimitError'
              timeout_error: '#/components/schemas/BetaGatewayTimeoutError'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/BetaInvalidRequestError'
          - $ref: '#/components/schemas/BetaAuthenticationError'
          - $ref: '#/components/schemas/BetaBillingError'
          - $ref: '#/components/schemas/BetaPermissionError'
          - $ref: '#/components/schemas/BetaNotFoundError'
          - $ref: '#/components/schemas/BetaRateLimitError'
          - $ref: '#/components/schemas/BetaGatewayTimeoutError'
          - $ref: '#/components/schemas/BetaAPIError'
          - $ref: '#/components/schemas/BetaOverloadedError'
          title: Error
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Request Id
        type:
          const: error
          default: error
          title: Type
          type: string
      required:
      - error
      - request_id
      - type
      title: ErrorResponse
      type: object
    BetaTimestamp:
      description: A timestamp in RFC 3339 format
      type: string
      format: date-time
    BetaOverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
          default: overloaded_error
          title: Type
          type: string
      required:
      - message
      - type
      title: OverloadedError
      type: object
    BetaAPIError:
      properties:
        message:
          default: Internal server error
          title: Message
          type: string
        type:
          const: api_error
          default: api_error
          title: Type
          type: string
      required:
      - message
      - type
      title: APIError
      type: object
    BetaAuthenticationError:
      properties:
        message:
          default: Authentication error
          title: Message
          type: string
        type:
          const: authentication_error
          default: authentication_error
          title: Type
          type: string
      required:
      - message
      - type
      title: AuthenticationError
      type: object
    BetaBillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    BetaNotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    BetaEnrollmentUrl:
      type: object
      additionalProperties: false
      required:
      - url
      - expires_at
      - type
      properties:
        url:
          description: Enrollment URL to send to the end user. Valid until `expires_at`.
          type: string
          examples:
          - https://platform.claude.com/user-profiles/enrollment/M3J0bGJxZ2ppMnptbnB1
        expires_at:
          description: When this enrollment URL expires, in RFC 3339 format.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:15:00Z'
        type:
          description: Object type. Always `enrollment_url`.
          type: string
          enum:
          - enrollment_url
          examples:
          - enrollment_url
      example:
        type: enrollment_url
        url: https://platform.claude.com/user-profiles/enrollment/M3J0bGJxZ2ppMnptbnB1
        expires_at: '2026-03-15T10:15:00Z'
    BetaUserProfileAccessType:
      type: string
      description: 'How the platform uses the API on behalf of the entity this profile represents. `application`: the platform sells a product that uses the API behind the scenes, and the profile represents an individual end-user of that product. `passthrough`: the platform resells raw inference, and the profile identifies the resold-to company.'
      enum:
      - application
      - passthrough
    AnthropicBeta:
      anyOf:
      - type: string
      - type: string
        enum:
        - message-batches-2024-09-24
        - prompt-caching-2024-07-31
        - computer-use-2024-10-22
        - computer-use-2025-01-24
        - pdfs-2024-09-25
        - token-counting-2024-11-01
        - token-efficient-tools-2025-02-19
        - output-128k-2025-02-19
        - files-api-2025-04-14
        - mcp-client-2025-04-04
        - mcp-client-2025-11-20
        - dev-full-thinking-2025-05-14
        - interleaved-thinking-2025-05-14
        - code-execution-2025-05-22
        - extended-cache-ttl-2025-04-11
        - context-1m-2025-08-07
        - context-management-2025-06-27
        - model-context-window-exceeded-2025-08-26
        - skills-2025-10-02
        - fast-mode-2026-02-01
        - output-300k-2026-03-24
        - user-profiles-2026-03-24
        - user-profiles-2026-08-18
        - advisor-tool-2026-03-01
        - managed-agents-2026-04-01
        - cache-diagnosis-2026-04-07
        - dreaming-2026-04-21
        - thinking-token-count-2026-05-13
        - server-side-fallback-2026-06-01
        - server-side-fallback-2026-07-01
        - fallback-credit-2026-06-01
        - fallback-credit-2026-07-01
        - agent-memory-2026-07-22
        - mid-conversation-tool-changes-2026-07-01
        - compact-2026-01-12
        - computer-use-2025-11-24
        - mcp-tunnels-2026-06-22
        - structured-outputs-2025-11-13
        - task-budgets-2026-03-13
        - thinking-display-updates-2026-08-18
        - ce-user-management-2026-07-13
        x-stainless-nominal: false
    BetaUserProfile:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - trust_grants
      - created_at
      - metadata
      - updated_at
      properties:
        id:
          description: Unique identifier for this user profile, prefixed `uprof_`.
          type: string
          examples:
          - uprof_011CZkZCu8hGbp5mYRQgUmz9
        type:
          description: Object type. Always `user_profile`.
          type: string
          enum:
          - user_profile
          examples:
          - user_profile
        external_id:
          description: Platform's own identifier for this user. Not enforced unique.
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - user_12345
        name:
          description: Real-world name of the entity this profile represents (company or individual). For a resold-to company (`access_type` `passthrough`, or `relationship` `resold` under the `user-profiles-2026-03-24` header) this is that company's name.
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - Example User
        relationship:
          description: How the entity relates to the platform. `external` (default), `resold`, or `internal`. Present under the `user-profiles-2026-03-24` beta header.
          allOf:
          - $ref: '#/components/schemas/BetaUserProfileRelationship'
          x-anthropic-beta-required:
          - user-profiles-2026-03-24
          examples:
          - external
        access_type:
          description: 'How the platform uses the API for this entity: `application` (default) or `passthrough`. Present under the `user-profiles-2026-08-18` beta header.'
          allOf:
          - $ref: '#/components/schemas/BetaUserProfileAccessType'
          x-anthropic-beta-required:
          - user-profiles-2026-08-18
        trust_grants:
          description: Trust grants for this profile, keyed by grant name. Key omitted when no grant is active or in flight.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/BetaUserProfileTrustGrant'
          examples:
          - cyber:
              status: active
        created_at:
          description: When this user profile was created, in RFC 3339 format.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:00:00Z'
        metadata:
          description: Arbitrary key-value metadata. Maximum 16 pairs, keys up to 64 chars, values up to 512 chars.
          type: object
          additionalProperties:
            type: string
          examples:
          - {}
        updated_at:
          description: When this user profile was last modified, in RFC 3339 format. Trust-grant status changes also bump this timestamp.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:00:00Z'
      example:
        id: uprof_011CZkZCu8hGbp5mYRQgUmz9
        type: user_profile
        external_id: user_12345
        name: Example User
        relationship: external
        trust_grants:
          cyber:
            status: active
        metadata: {}
        created_at: '2026-03-15T10:00:00Z'
        updated_at: '2026-03-15T10:00:00Z'
    BetaUpdateUserProfileRequestBody:
      type: object
      additionalProperties: false
      properties:
        external_id:
          description: If present, replaces the stored external_id. Omit to leave unchanged. Maximum 255 characters.
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          examples:
          - user_12345
        metadata:
          description: Key-value pairs to merge into the stored metadata. Keys provided overwrite existing values. To remove a key, set its value to an empty string. Keys not provided are left unchanged. Maximum 16 keys, with keys up to 64 characters and values up to 512 characters.
          type: object
          additionalProperties:
            type: string
        name:
          description: If present, replaces the stored name. Omit to leave unchanged. Maximum 255 characters.
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
        relationship:
          description: If present, replaces the stored relationship. Omit to leave unchanged.
          anyOf:
          - $ref: '#/components/schemas/BetaUserProfileRelationship'
          - type: 'null'
          x-anthropic-beta-required:
          - user-profiles-2026-03-24
        access_type:
          description: If present, replaces the stored access type. Omit to leave unchanged.
          anyOf:
          - $ref: '#/components/schemas/BetaUserProfileAccessType'
          - type: 'null'
          x-anthropic-beta-required:
          - user-profiles-2026-08-18
      example:
        external_id: user_12345
    BetaRateLimitError:
      properties:
        message:
          default: Rate limited
          title: Message
          type: string
        type:
          const: rate_limit_error
          default: rate_limit_error
          title: Type
          type: string
      required:
      - message
      - type
      title: RateLimitError
      type: object
    BetaUserProfileTrustGrant:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          description: Status of the trust grant.
          type: string
          enum:
          - active
          - pending
          - rejected
          examples:
          - active
      example:
        status: active
    BetaInvalidRequestError:
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          const: invalid_request_error
          default: invalid_request_error
          title: Type
          type: string
      required:
      - message
      - type
      title: InvalidRequestError
      type: object
    BetaPermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
