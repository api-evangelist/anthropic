components:
  schemas:
    BetaGatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    FileMetadataSchema:
      properties:
        created_at:
          description: RFC 3339 datetime string representing when the file was created.
          examples:
          - '2025-04-15T18:37:24.100435Z'
          format: date-time
          title: Created At
          type: string
        downloadable:
          default: false
          description: Whether the file can be downloaded.
          examples:
          - false
          title: Downloadable
          type: boolean
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          description: RFC 3339 datetime string representing when the file will expire and become unavailable for download. Null if the file does not expire. For files uploaded with `expires_in_seconds`, this is the upload time plus that value.
          examples:
          - '2025-05-15T18:37:24.100435Z'
          title: Expires At
        filename:
          description: Original filename of the uploaded file.
          examples:
          - document.pdf
          maxLength: 500
          minLength: 1
          title: Filename
          type: string
        id:
          description: 'Unique object identifier.


            The format and length of IDs may change over time.'
          examples:
          - file_011CNha8iCJcU1wXNR6q4V8w
          title: Id
          type: string
        mime_type:
          description: MIME type of the file.
          examples:
          - application/pdf
          maxLength: 255
          minLength: 1
          title: Mime Type
          type: string
        size_bytes:
          description: Size of the file in bytes.
          examples:
          - 102400
          minimum: 0
          title: Size Bytes
          type: integer
        type:
          const: file
          description: 'Object type.


            For files, this is always `"file"`.'
          title: Type
          type: string
      required:
      - created_at
      - filename
      - id
      - mime_type
      - size_bytes
      - type
      title: FileMetadataSchema
      type: object
    BetaOverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
          default: overloaded_error
          title: Type
          type: string
      required:
      - message
      - type
      title: OverloadedError
      type: object
    BetaBillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    FileDeleteResponse:
      properties:
        id:
          type: string
          title: Id
          description: ID of the deleted file.
          examples:
          - file_011CNha8iCJcU1wXNR6q4V8w
        type:
          type: string
          const: file_deleted
          title: Type
          description: 'Deleted object type.


            For file deletion, this is always `"file_deleted"`.'
          default: file_deleted
      type: object
      required:
      - id
      title: FileDeleteResponse
    PermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
    NotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    BetaAuthenticationError:
      properties:
        message:
          default: Authentication error
          title: Message
          type: string
        type:
          const: authentication_error
          default: authentication_error
          title: Type
          type: string
      required:
      - message
      - type
      title: AuthenticationError
      type: object
    BillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    BetaNotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    ErrorResponse:
      properties:
        error:
          discriminator:
            mapping:
              api_error: '#/components/schemas/APIError'
              authentication_error: '#/components/schemas/AuthenticationError'
              billing_error: '#/components/schemas/BillingError'
              invalid_request_error: '#/components/schemas/InvalidRequestError'
              not_found_error: '#/components/schemas/NotFoundError'
              overloaded_error: '#/components/schemas/OverloadedError'
              permission_error: '#/components/schemas/PermissionError'
              rate_limit_error: '#/components/schemas/RateLimitError'
              timeout_error: '#/components/schemas/GatewayTimeoutError'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/InvalidRequestError'
          - $ref: '#/components/schemas/AuthenticationError'
          - $ref: '#/components/schemas/BillingError'
          - $ref: '#/components/schemas/PermissionError'
          - $ref: '#/components/schemas/NotFoundError'
          - $ref: '#/components/schemas/RateLimitError'
          - $ref: '#/components/schemas/GatewayTimeoutError'
          - $ref: '#/components/schemas/APIError'
          - $ref: '#/components/schemas/OverloadedError'
          title: Error
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Request Id
        type:
          const: error
          default: error
          title: Type
          type: string
      required:
      - error
      - request_id
      - type
      title: ErrorResponse
      type: object
    GatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaInvalidRequestError:
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          const: invalid_request_error
          default: invalid_request_error
          title: Type
          type: string
      required:
      - message
      - type
      title: InvalidRequestError
      type: object
    BetaPermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
    BetaFileScope:
      properties:
        id:
          description: The ID of the scoping resource (e.g., the session ID).
          title: Id
          type: string
        type:
          const: session
          description: The type of scope (e.g., `"session"`).
          title: Type
          type: string
