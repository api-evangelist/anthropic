      operationId: BetaCreateTunnelCertificate
      summary: Create Tunnel Certificate
      description: 'The Tunnels API is in research preview. It requires the `anthropic-beta: mcp-tunnels-2026-06-22` header and may change without a deprecation period. It supersedes the Admin API endpoints at `/v1/organizations/tunnels`, which remain available during a migration window.


        Registers a public CA certificate on a tunnel. Anthropic verifies the gateway''s server certificate against this CA when it terminates the inner TLS session. A tunnel holds at most two non-archived certificates.'
      parameters:
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
      - name: anthropic-beta
        in: header
        required: false
