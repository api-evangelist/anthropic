      - name: tunnel_id
        in: path
        required: true
        schema:
          type: string
        description: Path parameter tunnel_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BetaCreateTunnelCertificateRequestBody'
      responses:
        '200':
          description: Successful response (OK)
