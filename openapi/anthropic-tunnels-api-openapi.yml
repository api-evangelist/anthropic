components:
  schemas:
    BetaGatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaAPIError:
      properties:
        message:
          default: Internal server error
          title: Message
          type: string
        type:
          const: api_error
          default: api_error
          title: Type
          type: string
      required:
      - message
      - type
      title: APIError
      type: object
    BetaErrorResponse:
      properties:
        error:
          discriminator:
            mapping:
              api_error: '#/components/schemas/BetaAPIError'
              authentication_error: '#/components/schemas/BetaAuthenticationError'
              billing_error: '#/components/schemas/BetaBillingError'
              invalid_request_error: '#/components/schemas/BetaInvalidRequestError'
              not_found_error: '#/components/schemas/BetaNotFoundError'
              overloaded_error: '#/components/schemas/BetaOverloadedError'
              permission_error: '#/components/schemas/BetaPermissionError'
              rate_limit_error: '#/components/schemas/BetaRateLimitError'
              timeout_error: '#/components/schemas/BetaGatewayTimeoutError'
            propertyName: type
          oneOf:
          - $ref: '#/components/schemas/BetaInvalidRequestError'
          - $ref: '#/components/schemas/BetaAuthenticationError'
          - $ref: '#/components/schemas/BetaBillingError'
          - $ref: '#/components/schemas/BetaPermissionError'
          - $ref: '#/components/schemas/BetaNotFoundError'
          - $ref: '#/components/schemas/BetaRateLimitError'
          - $ref: '#/components/schemas/BetaGatewayTimeoutError'
          - $ref: '#/components/schemas/BetaAPIError'
          - $ref: '#/components/schemas/BetaOverloadedError'
          title: Error
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Request Id
        type:
          const: error
          default: error
          title: Type
          type: string
      required:
      - error
      - request_id
      - type
      title: ErrorResponse
      type: object
    BetaTimestamp:
      description: A timestamp in RFC 3339 format
      type: string
      format: date-time
    BetaOverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
          default: overloaded_error
          title: Type
          type: string
      required:
      - message
      - type
      title: OverloadedError
      type: object
    BetaTunnelCertificate:
      description: A CA certificate attached to a tunnel.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - tunnel_id
      - fingerprint
      - expires_at
      - created_at
      - archived_at
      properties:
        type:
          type: string
          const: tunnel_certificate
        id:
          description: Unique identifier for the certificate, prefixed with `tcrt_`.
          type: string
        tunnel_id:
          description: ID of the tunnel the certificate is registered against.
          type: string
        fingerprint:
          description: Lowercase hex SHA-256 fingerprint of the certificate's DER encoding.
          type: string
        expires_at:
          description: RFC 3339 datetime string indicating when the certificate expires, or `null` if it does not expire.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
        created_at:
          description: RFC 3339 datetime string indicating when the certificate was registered.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
        archived_at:
          description: RFC 3339 datetime string indicating when the certificate was archived. Null if it is still in the trusted set.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
    BetaAuthenticationError:
      properties:
        message:
          default: Authentication error
          title: Message
          type: string
        type:
          const: authentication_error
          default: authentication_error
          title: Type
          type: string
      required:
      - message
      - type
      title: AuthenticationError
      type: object
    BetaRotateTunnelTokenRequestBody:
      type: object
      additionalProperties: false
      properties:
        reason:
          description: Optional free-text reason for the rotation, recorded for audit.
          anyOf:
          - type: string
            maxLength: 1024
          - type: 'null'
    BetaNotFoundError:
      properties:
        message:
          default: Not found
          title: Message
          type: string
        type:
          const: not_found_error
          default: not_found_error
          title: Type
          type: string
      required:
      - message
      - type
      title: NotFoundError
      type: object
    BetaBillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    BetaCreateTunnelCertificateRequestBody:
      type: object
      additionalProperties: false
      required:
      - ca_certificate_pem
      properties:
        ca_certificate_pem:
          description: PEM-encoded X.509 CA certificate. Must contain exactly one certificate and no private-key material. Maximum 8KB.
          type: string
          maxLength: 8192
    BetaTunnel:
      description: An MCP tunnel.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - domain
      - display_name
      - created_at
      - archived_at
      properties:
        type:
          type: string
          const: tunnel
        id:
          description: Unique identifier for the tunnel, prefixed with `tnl_`.
          type: string
        domain:
          description: Anthropic-assigned hostname for the tunnel. MCP server URLs whose host is a subdomain of this value are routed through the tunnel. Globally unique and never reused, even after the tunnel is archived.
          type: string
        display_name:
          description: Human-readable name for the tunnel (1-255 characters). Null if unset.
          anyOf:
          - type: string
          - type: 'null'
        created_at:
          description: RFC 3339 datetime string indicating when the tunnel was created.
          allOf:
          - $ref: '#/components/schemas/BetaTimestamp'
        archived_at:
          description: RFC 3339 datetime string indicating when the tunnel was archived. Null if it is not archived.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
    AnthropicBeta:
      anyOf:
      - type: string
      - type: string
        enum:
        - message-batches-2024-09-24
        - prompt-caching-2024-07-31
        - computer-use-2024-10-22
        - computer-use-2025-01-24
        - pdfs-2024-09-25
        - token-counting-2024-11-01
        - token-efficient-tools-2025-02-19
        - output-128k-2025-02-19
        - files-api-2025-04-14
        - mcp-client-2025-04-04
        - mcp-client-2025-11-20
        - dev-full-thinking-2025-05-14
        - interleaved-thinking-2025-05-14
        - code-execution-2025-05-22
        - extended-cache-ttl-2025-04-11
        - context-1m-2025-08-07
        - context-management-2025-06-27
        - model-context-window-exceeded-2025-08-26
        - skills-2025-10-02
        - fast-mode-2026-02-01
        - output-300k-2026-03-24
        - user-profiles-2026-03-24
        - user-profiles-2026-08-18
        - advisor-tool-2026-03-01
        - managed-agents-2026-04-01
        - cache-diagnosis-2026-04-07
        - dreaming-2026-04-21
        - thinking-token-count-2026-05-13
        - server-side-fallback-2026-06-01
        - server-side-fallback-2026-07-01
        - fallback-credit-2026-06-01
        - fallback-credit-2026-07-01
        - agent-memory-2026-07-22
        - mid-conversation-tool-changes-2026-07-01
        - compact-2026-01-12
        - computer-use-2025-11-24
        - mcp-tunnels-2026-06-22
        - structured-outputs-2025-11-13
        - task-budgets-2026-03-13
        - thinking-display-updates-2026-08-18
        - ce-user-management-2026-07-13
        x-stainless-nominal: false
    BetaListTunnelCertificatesResponse:
      description: The tunnel's certificates.
      type: object
      additionalProperties: false
      required:
      - data
      - next_page
      properties:
        data:
          description: List of certificates, ordered by created_at descending.
          type: array
          items:
            $ref: '#/components/schemas/BetaTunnelCertificate'
        next_page:
          description: Pagination cursor for the next page, or null if no more results.
          anyOf:
          - type: string
          - type: 'null'
    BetaRateLimitError:
      properties:
        message:
          default: Rate limited
          title: Message
          type: string
        type:
          const: rate_limit_error
          default: rate_limit_error
          title: Type
          type: string
      required:
      - message
      - type
      title: RateLimitError
      type: object
    BetaTunnelToken:
      description: A tunnel's connector token.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      - tunnel_token
      properties:
        type:
          type: string
          const: tunnel_token
        id:
          description: Stable identifier for the current token value. Changes when the token is rotated.
          type: string
        tunnel_token:
          description: The connector token used to run the tunnel. Treat as a credential.
          type: string
    BetaInvalidRequestError:
      properties:
        message:
          default: Invalid request
          title: Message
          type: string
        type:
          const: invalid_request_error
          default: invalid_request_error
          title: Type
          type: string
      required:
      - message
      - type
      title: InvalidRequestError
      type: object
    BetaPermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
