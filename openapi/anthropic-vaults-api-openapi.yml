    BetaManagedAgentsMcpOauthRefreshParams:
      description: OAuth refresh token parameters for creating a credential with refresh support.
      type: object
      additionalProperties: false
      required:
      - refresh_token
      - token_endpoint
      - client_id
      - token_endpoint_auth
      properties:
        refresh_token:
          description: OAuth refresh token.
          type: string
          minLength: 1
          maxLength: 4096
        token_endpoint:
          description: Token endpoint URL used to refresh the access token.
          type: string
          minLength: 1
          maxLength: 2047
        client_id:
          description: OAuth client ID.
          type: string
          minLength: 1
          maxLength: 1024
        scope:
          description: OAuth scope for the refresh request.
          anyOf:
          - type: string
            minLength: 1
            maxLength: 8192
          - type: 'null'
        resource:
          description: OAuth resource indicator.
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2047
          - type: 'null'
        token_endpoint_auth:
          type: object
          discriminator:
            propertyName: type
            mapping:
              none: '#/components/schemas/BetaManagedAgentsTokenEndpointAuthNoneParam'
              client_secret_basic: '#/components/schemas/BetaManagedAgentsTokenEndpointAuthBasicParam'
              client_secret_post: '#/components/schemas/BetaManagedAgentsTokenEndpointAuthPostParam'
          oneOf:
          - $ref: '#/components/schemas/BetaManagedAgentsTokenEndpointAuthNoneParam'
          - $ref: '#/components/schemas/BetaManagedAgentsTokenEndpointAuthBasicParam'
          - $ref: '#/components/schemas/BetaManagedAgentsTokenEndpointAuthPostParam'
    BetaManagedAgentsMcpProbe:
      description: The failing step of an MCP validation probe.
      type: object
      additionalProperties: false
      required:
      - method
      - http_response
      properties:
        method:
          description: The MCP method that failed (for example `initialize` or `tools/list`).
          type: string
        http_response:
          description: The captured HTTP error response. Null when no HTTP response was received (timeout, DNS, TLS).
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsRefreshHttpResponse'
          - type: 'null'
    BetaManagedAgentsInjectionLocationParams:
      description: Where in the outbound request the secret value may be substituted.
      type: object
      additionalProperties: false
      properties:
        header:
          description: Substitute when the placeholder appears in a request header value.
          type: boolean
        body:
          description: Substitute when the placeholder appears in the request body.
          type: boolean
