      - no_refresh_token
    BetaManagedAgentsRefreshHttpResponse:
      description: An HTTP response captured during a credential validation probe.
      type: object
      additionalProperties: false
      required:
      - status_code
      - content_type
      - body
      - body_truncated
      properties:
        status_code:
          description: HTTP status code.
          type: integer
          format: int32
        content_type:
          description: Value of the `Content-Type` response header.
          type: string
        body:
          description: Response body. May be truncated and has sensitive values scrubbed.
          type: string
        body_truncated:
          description: Whether `body` was truncated.
          type: boolean
    BetaManagedAgentsLimitedCredentialNetworkingResponse:
      description: The secret is substituted only on requests to the listed hosts.
      type: object
      additionalProperties: false
      required:
      - type
      - allowed_hosts
      properties:
        type:
          type: string
          enum:
          - limited
        allowed_hosts:
          description: Hostnames on which the secret will be substituted. An entry matches the request host exactly; a `*.`-prefixed entry matches any subdomain of the named domain but not the domain itself.
          type: array
          items:
            type: string
    BetaManagedAgentsEnvironmentVariableCreateParams:
      description: Parameters for creating an environment variable credential.
      type: object
      additionalProperties: false
      required:
      - type
      - secret_name
      - secret_value
      - networking
      properties:
        type:
          type: string
          enum:
          - environment_variable
        secret_name:
          description: Name of the environment variable. Immutable after create.
          type: string
          minLength: 1
          maxLength: 255
        secret_value:
          description: Secret value. Write-only; never returned in responses.
          type: string
          minLength: 1
          maxLength: 4096
        networking:
          description: Outbound hosts the secret value is substituted on.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsCredentialNetworkingParams'
