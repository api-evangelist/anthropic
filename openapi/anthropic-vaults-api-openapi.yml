components:
  schemas:
    BetaGatewayTimeoutError:
      properties:
        message:
          default: Request timeout
          title: Message
          type: string
        type:
          const: timeout_error
          default: timeout_error
          title: Type
          type: string
      required:
      - message
      - type
      title: GatewayTimeoutError
      type: object
    BetaManagedAgentsCredentialUpdateAuth:
      description: Updated authentication details for a credential.
      type: object
      discriminator:
        propertyName: type
        mapping:
          mcp_oauth: '#/components/schemas/BetaManagedAgentsMcpOauthUpdateParams'
          static_bearer: '#/components/schemas/BetaManagedAgentsStaticBearerUpdateParams'
          environment_variable: '#/components/schemas/BetaManagedAgentsEnvironmentVariableUpdateParams'
      oneOf:
      - $ref: '#/components/schemas/BetaManagedAgentsMcpOauthUpdateParams'
      - $ref: '#/components/schemas/BetaManagedAgentsStaticBearerUpdateParams'
      - $ref: '#/components/schemas/BetaManagedAgentsEnvironmentVariableUpdateParams'
    BetaTimestamp:
      description: A timestamp in RFC 3339 format
      type: string
      format: date-time
    BetaOverloadedError:
      properties:
        message:
          default: Overloaded
          title: Message
          type: string
        type:
          const: overloaded_error
          default: overloaded_error
          title: Type
          type: string
      required:
      - message
      - type
      title: OverloadedError
      type: object
    BetaManagedAgentsUnrestrictedCredentialNetworkingParams:
      description: Substitute the secret on any host the session's Environment network policy permits egress to. The Environment's network policy is the only boundary on where the secret can reach.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - unrestricted
    BetaBillingError:
      properties:
        message:
          default: Billing error
          title: Message
          type: string
        type:
          const: billing_error
          default: billing_error
          title: Type
          type: string
      required:
      - message
      - type
      title: BillingError
      type: object
    BetaManagedAgentsTokenEndpointAuthNoneParam:
      description: Token endpoint requires no client authentication.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - none
    BetaManagedAgentsStaticBearerAuthResponse:
      description: Static bearer token credential details for an MCP server.
      type: object
      additionalProperties: false
      required:
      - type
      - mcp_server_url
      properties:
        type:
          type: string
          enum:
          - static_bearer
          examples:
          - static_bearer
        mcp_server_url:
          description: URL of the MCP server this credential authenticates against.
          type: string
          examples:
          - https://example-server.modelcontextprotocol.io/sse
      example:
        type: static_bearer
        mcp_server_url: https://example-server.modelcontextprotocol.io/sse
    BetaManagedAgentsListCredentialsResponse:
      description: Response containing a paginated list of credentials.
      type: object
      additionalProperties: false
      properties:
        data:
          description: List of credentials.
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsCredential'
          examples:
          - - type: vault_credential
              id: vcrd_011CZkZEMt8gZan2iYOQfSkw
              vault_id: vlt_011CZkZDLs7fYzm1hXNPeRjv
              display_name: Example credential
              metadata:
                environment: production
              created_at: '2026-03-15T10:00:00Z'
              updated_at: '2026-03-15T10:00:00Z'
              archived_at: null
              auth:
                type: static_bearer
                mcp_server_url: https://example-server.modelcontextprotocol.io/sse
        next_page:
          description: Pagination token for the next page, or null if no more results.
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - page_MjAyNS0wNS0xNFQwMDowMDowMFo=
      example:
        data:
        - type: vault_credential
          id: vcrd_011CZkZEMt8gZan2iYOQfSkw
          vault_id: vlt_011CZkZDLs7fYzm1hXNPeRjv
          display_name: Example credential
          metadata:
            environment: production
          created_at: '2026-03-15T10:00:00Z'
          updated_at: '2026-03-15T10:00:00Z'
          archived_at: null
          auth:
            type: static_bearer
            mcp_server_url: https://example-server.modelcontextprotocol.io/sse
        next_page: page_MjAyNS0wNS0xNFQwMDowMDowMFo=
    BetaManagedAgentsLimitedCredentialNetworkingParams:
      description: Substitute the secret only on requests to the listed hosts.
      type: object
      additionalProperties: false
      required:
      - type
      - allowed_hosts
      properties:
        type:
          type: string
          enum:
          - limited
        allowed_hosts:
          description: Hostnames on which the secret will be substituted. Each entry is a bare hostname (`api.example.com`), an IPv4 address (`192.0.2.1`), or a `*.`-prefixed wildcard (`*.example.com`). URLs, ports, paths, and IPv6 addresses are not accepted. At most 16 entries.
          type: array
          items:
            type: string
    BetaManagedAgentsTokenEndpointAuthPostResponse:
      description: Token endpoint uses POST body authentication with client credentials.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - client_secret_post
    BetaManagedAgentsDeletedCredential:
      description: Confirmation of a deleted credential.
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - vault_credential_deleted
          examples:
          - vault_credential_deleted
        id:
          description: Unique identifier of the deleted credential.
          type: string
          examples:
          - vcrd_011CZkZEMt8gZan2iYOQfSkw
      example:
        type: vault_credential_deleted
        id: vcrd_011CZkZEMt8gZan2iYOQfSkw
    BetaManagedAgentsTokenEndpointAuthBasicUpdateParam:
      description: Updated HTTP Basic authentication parameters for the token endpoint.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
