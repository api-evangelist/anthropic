      properties:
        version:
          description: The agent's current version, used to prevent concurrent overwrites. Obtain this value from a create or retrieve response. Must be at least 1 if specified. When supplied, the request fails if it does not match the server's current version; omit to apply the update unconditionally.
          type: integer
          format: int32
          examples:
          - 1
        name:
          description: Human-readable name. Must be non-empty. Omit to preserve. Cannot be cleared.
          type: string
          maxLength: 256
        description:
          description: Description. Omit to preserve; send empty string or null to clear.
          anyOf:
          - type: string
            maxLength: 2048
          - type: 'null'
        model:
          description: Model identifier. Accepts the [model string](https://platform.claude.com/docs/en/about-claude/models/overview#latest-models-comparison), e.g. `claude-opus-5`, or a `model_config` object for additional configuration control. Omit to preserve. Cannot be cleared.
          allOf:
          - $ref: '#/components/schemas/BetaManagedAgentsModelParams'
        system:
          description: System prompt. Omit to preserve; send empty string or null to clear.
          anyOf:
          - type: string
            maxLength: 100000
          - type: 'null'
          examples:
          - You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
        tools:
          description: Tool configurations available to the agent. Full replacement. Omit to preserve; send empty array or null to clear. Maximum of 128 tools across all toolsets allowed.
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/BetaManagedAgentsAgentToolParams'
          - type: 'null'
        mcp_servers:
          description: MCP servers. Full replacement. Omit to preserve; send empty array or `null` to clear. Names must be unique. Maximum 20. Every server must be referenced by an `mcp_toolset` in the agent's resulting `tools`; unreferenced servers are rejected. See the [MCP connector guide](https://platform.claude.com/docs/en/managed-agents/mcp-connector).
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/BetaManagedAgentsMCPServerParams'
          - type: 'null'
        skills:
          description: Skills. Full replacement. Omit to preserve; send empty array or null to clear.
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/BetaManagedAgentsSkillParams'
          - type: 'null'
        metadata:
          description: Metadata patch. Set a key to a string to upsert it, or to null to delete it. Omit the field to preserve. The stored bag is limited to 16 keys (up to 64 chars each) with values up to 512 chars.
          anyOf:
          - type: object
            additionalProperties:
              anyOf:
              - type: string
              - type: 'null'
          - type: 'null'
        multiagent:
          description: Multiagent orchestration configuration. Full replacement. Omit to preserve; send null to clear.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsMultiagentParams'
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
      example:
        version: 1
        system: You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
