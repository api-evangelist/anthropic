      properties:
        type:
          type: string
          enum:
          - agent
          examples:
          - agent
        id:
          type: string
          examples:
          - agent_011CZkYpogX7uDKUyvBTophP
        version:
          description: The agent's current version. Starts at 1 and increments when the agent is modified.
          type: integer
          format: int32
          examples:
          - 1
        name:
          type: string
          examples:
          - My First Agent
        description:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - A general-purpose starter agent.
        model:
          $ref: '#/components/schemas/BetaManagedAgentsModelConfig'
          examples:
          - id: claude-opus-5
            speed: standard
        system:
          anyOf:
          - type: string
          - type: 'null'
          examples:
          - You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
        tools:
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsAgentTool'
          examples:
          - - type: agent_toolset_20260401
              default_config:
                enabled: true
                permission_policy:
                  type: always_ask
              configs: []
        mcp_servers:
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsMCPServer'
          examples:
          - - type: url
              name: example-mcp
              url: https://example-server.modelcontextprotocol.io/sse
        skills:
          type: array
          items:
            $ref: '#/components/schemas/BetaManagedAgentsSkill'
          examples:
          - - type: anthropic
              skill_id: xlsx
              version: '1'
            - type: custom
              skill_id: skill_011CZkZFNu9hAbo3jZPRgTlx
              version: '2'
        metadata:
          type: object
          additionalProperties:
            type: string
          examples:
          - foo: bar
        created_at:
          $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:00:00Z'
        updated_at:
          $ref: '#/components/schemas/BetaTimestamp'
          examples:
          - '2026-03-15T10:00:00Z'
        archived_at:
          description: When the agent was archived. Null if not archived.
          anyOf:
          - $ref: '#/components/schemas/BetaTimestamp'
          - type: 'null'
          examples:
          - null
        multiagent:
          description: Multiagent orchestration configuration. Null when the agent is single-threaded.
          anyOf:
          - $ref: '#/components/schemas/BetaManagedAgentsMultiagent'
          - type: 'null'
          x-anthropic-beta-required:
          - managed-agents-2026-04-01
          examples:
          - null
      example:
        type: agent
        id: agent_011CZkYpogX7uDKUyvBTophP
        version: 1
        name: My First Agent
        description: A general-purpose starter agent.
        model:
          id: claude-opus-5
          speed: standard
        system: You are a general-purpose agent that can research, write code, run commands, and use connected tools to complete the user's task end to end.
        tools:
        - type: agent_toolset_20260401
          default_config:
            enabled: true
            permission_policy:
              type: always_ask
          configs: []
        mcp_servers:
        - type: url
          name: example-mcp
          url: https://example-server.modelcontextprotocol.io/sse
        skills:
        - type: anthropic
          skill_id: xlsx
          version: '1'
        - type: custom
          skill_id: skill_011CZkZFNu9hAbo3jZPRgTlx
          version: '2'
        multiagent: null
        metadata:
          foo: bar
        created_at: '2026-03-15T10:00:00Z'
        updated_at: '2026-03-15T10:00:00Z'
        archived_at: null
