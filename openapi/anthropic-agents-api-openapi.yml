      tags:
      - Agents
    servers:
    - url: https://api.anthropic.com
  /v1/agents:
    post:
      summary: Anthropic Create Agent
      description: Define a reusable, versioned agent.
      operationId: createAgent
      tags:
      - Agents
      parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/AnthropicBeta'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRequest'
      responses:
        '200':
          description: Agent created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        4XX:
          $ref: '#/components/responses/ErrorResponse'
      security:
      - ApiKeyAuth: []
    get:
      summary: Anthropic List Agents
      description: Paginated list of agents in the workspace.
      operationId: listAgents
      tags:
      - Agents
      parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/AnthropicBeta'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of agents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.anthropic.com
      description: Production Server
  /v1/agents/{agent_id}:
    get:
      summary: Anthropic Get Agent
      description: Retrieve an agent's latest version.
      operationId: getAgent
      tags:
      - Agents
      parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/AnthropicBeta'
      - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Agent retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      security:
      - ApiKeyAuth: []
    post:
      summary: Anthropic Update Agent
      description: Update an agent. Pass the current version to optimistically lock the update. A new version is created when fields change.
      operationId: updateAgent
      tags:
      - Agents
      parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/AnthropicBeta'
      - $ref: '#/components/parameters/AgentIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAgentRequest'
      responses:
        '200':
          description: Agent updated; new version returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.anthropic.com
      description: Production Server
  /v1/agents/{agent_id}/archive:
    post:
      summary: Anthropic Archive Agent
      description: Archive an agent; existing sessions continue running.
      operationId: archiveAgent
      tags:
      - Agents
      parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/AnthropicBeta'
      - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Agent archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.anthropic.com
      description: Production Server
  /v1/agents/{agent_id}/versions:
    get:
      summary: Anthropic List Agent Versions
      description: Full version history for the agent.
      operationId: listAgentVersions
      tags:
      - Agents
      parameters:
      - $ref: '#/components/parameters/AnthropicVersion'
      - $ref: '#/components/parameters/AnthropicBeta'
      - $ref: '#/components/parameters/AgentIdPath'
      responses:
        '200':
          description: Agent versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
      security:
      - ApiKeyAuth: []
    servers:
    - url: https://api.anthropic.com
      description: Production Server
components:
  schemas:
    AnthropicBeta:
      anyOf:
      - type: string
      - type: string
        enum:
        - message-batches-2024-09-24
        - prompt-caching-2024-07-31
        - computer-use-2024-10-22
        - computer-use-2025-01-24
        - pdfs-2024-09-25
        - token-counting-2024-11-01
        - token-efficient-tools-2025-02-19
        - output-128k-2025-02-19
        - files-api-2025-04-14
        - mcp-client-2025-04-04
        - mcp-client-2025-11-20
        - dev-full-thinking-2025-05-14
        - interleaved-thinking-2025-05-14
        - code-execution-2025-05-22
        - extended-cache-ttl-2025-04-11
        - context-1m-2025-08-07
        - context-management-2025-06-27
        - model-context-window-exceeded-2025-08-26
        - skills-2025-10-02
        - fast-mode-2026-02-01
        - output-300k-2026-03-24
        - user-profiles-2026-03-24
        - user-profiles-2026-08-18
        - advisor-tool-2026-03-01
        - managed-agents-2026-04-01
        - cache-diagnosis-2026-04-07
        - dreaming-2026-04-21
        - thinking-token-count-2026-05-13
        - server-side-fallback-2026-06-01
        - server-side-fallback-2026-07-01
        - fallback-credit-2026-06-01
        - fallback-credit-2026-07-01
        - agent-memory-2026-07-22
        - mid-conversation-tool-changes-2026-07-01
        - compact-2026-01-12
        - computer-use-2025-11-24
        - mcp-tunnels-2026-06-22
        - structured-outputs-2025-11-13
        - task-budgets-2026-03-13
        - thinking-display-updates-2026-08-18
        - ce-user-management-2026-07-13
        x-stainless-nominal: false
    BetaManagedAgentsAnthropicSkill:
      description: A resolved Anthropic-managed skill.
      type: object
      additionalProperties: false
      required:
      - type
      - skill_id
      - version
      properties:
        type:
          type: string
          enum:
          - anthropic
          examples:
          - anthropic
        skill_id:
          type: string
          examples:
          - xlsx
        version:
          type: string
          examples:
          - '1'
      example:
        type: anthropic
        skill_id: xlsx
        version: '1'
    BetaManagedAgentsEffortLow:
      description: Low effort. Favors latency over reasoning depth.
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - low
    BetaManagedAgentsEffort:
      description: How hard Claude works on each turn. Sets `output_config.effort` on every Messages call the session makes.
      type: object
      discriminator:
        propertyName: type
        mapping:
          low: '#/components/schemas/BetaManagedAgentsEffortLow'
          medium: '#/components/schemas/BetaManagedAgentsEffortMedium'
          high: '#/components/schemas/BetaManagedAgentsEffortHigh'
          xhigh: '#/components/schemas/BetaManagedAgentsEffortXhigh'
          max: '#/components/schemas/BetaManagedAgentsEffortMax'
      oneOf:
      - $ref: '#/components/schemas/BetaManagedAgentsEffortLow'
      - $ref: '#/components/schemas/BetaManagedAgentsEffortMedium'
      - $ref: '#/components/schemas/BetaManagedAgentsEffortHigh'
      - $ref: '#/components/schemas/BetaManagedAgentsEffortXhigh'
      - $ref: '#/components/schemas/BetaManagedAgentsEffortMax'
    BetaManagedAgentsAgentParams:
      description: Specification for an Agent. Provide a specific `version` or use the short-form `agent="agent_id"` for the most recent version
      type: object
      additionalProperties: false
      required:
      - type
      - id
      properties:
        type:
          type: string
          enum:
          - agent
        id:
          description: The `agent` ID.
          type: string
          minLength: 1
          maxLength: 128
        version:
          description: The specific `agent` version to use. Omit to use the latest version. Must be at least 1 if specified.
          type: integer
          format: int32
    BetaPermissionError:
      properties:
        message:
          default: Permission denied
          title: Message
          type: string
        type:
          const: permission_error
          default: permission_error
          title: Type
          type: string
      required:
      - message
      - type
      title: PermissionError
      type: object
    BetaRateLimitError:
      properties:
        message:
          default: Rate limited
          title: Message
          type: string
        type:
          const: rate_limit_error
