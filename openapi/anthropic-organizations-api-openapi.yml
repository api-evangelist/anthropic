components:
  schemas:
    BetaApiKey:
      properties:
        created_at:
          type: string
          format: date-time
          title: Created At
          description: RFC 3339 datetime string indicating when the API Key was created.
          examples:
          - '2024-10-30T23:58:27.427722Z'
        created_by:
          anyOf:
          - $ref: '#/components/schemas/BetaCreatedBy'
          - type: 'null'
          description: 'The ID and type of the actor that created the API key, or `null` when the

            creator is not recorded (legacy, workload-identity-federated, or

            system-created keys).'
          examples:
          - id: user_01WCz1FkmYMm4gnmykNKUu3Q
            type: user
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: RFC 3339 datetime string indicating when the API Key expires, or `null` if it never expires.
          examples:
          - '2024-10-30T23:58:27.427722Z'
        id:
          type: string
          title: Id
          description: ID of the API key.
          examples:
          - apikey_01Rj2N8SVvo6BePZj99NhmiT
        name:
          type: string
          title: Name
          description: Name of the API key.
          examples:
          - Developer Key
        partial_key_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Partial Key Hint
          description: Partially redacted hint for the API key.
          examples:
          - sk-ant-api03-R2D...igAA
        principal:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/BetaApiKeyUserActor'
            - $ref: '#/components/schemas/BetaApiKeyServiceAccountActor'
            discriminator:
              propertyName: type
              mapping:
                service_account_actor: '#/components/schemas/BetaApiKeyServiceAccountActor'
                user_actor: '#/components/schemas/BetaApiKeyUserActor'
          - type: 'null'
          title: Principal
          description: The principal the API key acts as (a User or a Service Account), or `null` if the API key is not bound to a principal.
          examples:
          - type: user_actor
            user_id: user_01WCz1FkmYMm4gnmykNKUu3Q
        scope:
          oneOf:
          - $ref: '#/components/schemas/BetaApiKeyOrganizationScope'
          - $ref: '#/components/schemas/BetaApiKeyWorkspaceScope'
          title: Scope
          description: 'Where the API key belongs: its Workspace (`{"type": "workspace", "workspace_id": "wrkspc_..."}`, with the Workspace''s real ID even when it is the organization''s default Workspace), or the organization (`{"type": "organization"}`) for a principal-bound API key that has no Workspace.'
          examples:
          - type: workspace
            workspace_id: wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ
          discriminator:
            propertyName: type
            mapping:
              organization: '#/components/schemas/BetaApiKeyOrganizationScope'
              workspace: '#/components/schemas/BetaApiKeyWorkspaceScope'
        status:
          type: string
          enum:
          - active
          - archived
          - expired
          - inactive
          title: Status
          description: Status of the API key.
          examples:
          - active
        type:
          type: string
          const: api_key
          title: Type
          description: 'Object type.


            For API Keys, this is always `"api_key"`.'
          default: api_key
        workspace_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Workspace Id
          description: 'Deprecated: use `scope` instead. ID of the Workspace associated with the API key, or `null` if the API key belongs to the default Workspace. Also `null` for a principal-bound API key that has no Workspace; `scope` tells the two apart.'
          deprecated: true
          examples:
          - wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ
          x-stainless-deprecation-message: Use `scope` instead. `workspace_id` is `null` both for an API key in the default Workspace and for a principal-bound API key that has no Workspace.
      type: object
      required:
      - created_at
      - created_by
      - expires_at
      - id
      - name
      - partial_key_hint
      - principal
      - scope
      - status
      - type
      - workspace_id
      title: ApiKey
    BetaMessagesUsageReportGroupBy:
      type: string
      enum:
      - account_id
      - api_key_id
      - context_window
      - inference_geo
      - model
      - service_account_id
      - service_tier
      - speed
      - workspace_id
      title: MessagesUsageReportGroupBy
    BetaFederationIssuer:
      properties:
        archived_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archived At
          description: If set, all rules referencing this issuer reject token exchange.
        archived_by_actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Archived By Actor Id
          description: Tagged ID (`user_`/`svac_`) of the actor that archived this issuer.
        check_jti:
          type: boolean
          title: Check Jti
          description: Whether the jwt-bearer exchange enforces JTI single-use (replay protection) for tokens from this issuer. Applies only to assertions carrying a `jti` claim; tokens without one are accepted without single-use enforcement.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: When this issuer was created.
          examples:
          - '2024-10-30T23:58:27.427722Z'
        created_by_actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Created By Actor Id
          description: Tagged ID (`user_`/`svac_`) of the actor that created this issuer.
        id:
          type: string
          title: Id
          description: Tagged ID of the federation issuer.
          examples:
          - fdis_01SDCCSbTxrXDpWc1phhtcfK
        issuer_url:
          type: string
          title: Issuer Url
          description: The `iss` claim value. Incoming JWTs must match exactly.
          examples:
          - https://token.actions.githubusercontent.com
        jwks:
          oneOf:
          - $ref: '#/components/schemas/BetaJwksDiscovery'
          - $ref: '#/components/schemas/BetaJwksExplicitUrl'
          - $ref: '#/components/schemas/BetaJwksInline'
          title: Jwks
          description: How signing keys are obtained for signature verification.
          discriminator:
            propertyName: type
            mapping:
              discovery: '#/components/schemas/BetaJwksDiscovery'
              explicit_url: '#/components/schemas/BetaJwksExplicitUrl'
              inline: '#/components/schemas/BetaJwksInline'
        jwks_polling_disabled_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Jwks Polling Disabled At
          description: 'If set, Anthropic''s JWKS poller has paused polling for this issuer after repeated fetch failures. Re-enable by sending `jwks_polling_disabled: false` via the issuer update endpoint (POST) once the upstream JWKS endpoint is fixed. An OAuth caller cannot send this when the issuer backs a rule with any scope other than `workspace:developer` or `workspace:inference`; use a Console session.'
        max_jwt_lifetime_seconds:
          type: integer
          title: Max Jwt Lifetime Seconds
          description: Maximum allowed iat→exp spread for assertions from this issuer (1-176400 seconds, i.e. up to 49h). Assertions must carry both `iat` and `exp`; a missing `iat` is rejected.
        name:
          type: string
          title: Name
          description: Admin-chosen slug identifier.
          examples:
          - github-actions
        poll_status:
          anyOf:
          - $ref: '#/components/schemas/BetaIssuerPollStatus'
          - type: 'null'
          description: Live state of Anthropic's JWKS polling for this issuer. Populated on both single-issuer retrieval and list responses, including archived issuers. Typically null for inline-key issuers (no polling), or when poll status is temporarily unavailable or polling has not started yet.
        type:
          type: string
          const: federation_issuer
          title: Type
          default: federation_issuer
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: When this issuer was last updated.
          examples:
          - '2024-10-30T23:58:27.427722Z'
        updated_by_actor_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Updated By Actor Id
          description: Tagged ID (`user_`/`svac_`) of the actor that last updated this issuer.
      type: object
      required:
      - archived_at
      - archived_by_actor_id
