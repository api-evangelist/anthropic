    BetaFederationIssuerUpdateParams:
      properties:
        check_jti:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Check Jti
          description: Whether the jwt-bearer exchange enforces JTI single-use (replay protection) for tokens from this issuer. Applies only to assertions carrying a `jti` claim; tokens without one are accepted without single-use enforcement.
        issuer_url:
          anyOf:
          - type: string
            minLength: 1
          - type: 'null'
          title: Issuer Url
          description: Replaces the `iss` claim value to match against. For discovery-mode issuers without a `discovery_base`, this is also the URL Anthropic fetches the OIDC discovery document and signing keys from, so changing it repoints the JWKS source. Changing the issuer URL to a well-known shared platform is rejected while any live rule under this issuer would not constrain tenant identity.
        jwks:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/BetaJwksDiscovery'
            - $ref: '#/components/schemas/BetaJwksExplicitUrl'
            - $ref: '#/components/schemas/BetaJwksInline'
            discriminator:
              propertyName: type
              mapping:
                discovery: '#/components/schemas/BetaJwksDiscovery'
                explicit_url: '#/components/schemas/BetaJwksExplicitUrl'
                inline: '#/components/schemas/BetaJwksInline'
          - type: 'null'
          title: Jwks
          description: Replaces the entire JWKS configuration.
        jwks_polling_disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Jwks Polling Disabled
          description: Only `false` is accepted, to re-enable polling after the system pauses it. Polling is paused automatically; sending `true` is rejected.
        max_jwt_lifetime_seconds:
          anyOf:
          - type: integer
            maximum: 176400
            exclusiveMinimum: 0
          - type: 'null'
          title: Max Jwt Lifetime Seconds
          description: Maximum allowed iat→exp spread for assertions from this issuer (1-176400 seconds, i.e. up to 49h). Assertions must carry both `iat` and `exp`; a missing `iat` is rejected.
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Name
          description: Replaces the slug identifier (lowercase, digits, hyphens). Unique within the organization; a duplicate name returns 409.
      additionalProperties: false
      type: object
      title: FederationIssuerUpdateParams
      description: 'Partial update. Set fields are applied; omitted fields are unchanged.


        Setting `jwks` replaces the whole JWKS configuration at once.'
