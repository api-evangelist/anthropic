      title: AwsExternalKeyConfig
    BetaWorkspace:
      properties:
        archived_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archived At
          description: RFC 3339 datetime string indicating when the Workspace was archived, or `null` if the Workspace is not archived.
          examples:
          - '2024-11-01T23:59:27.427722Z'
        compartment_id:
          type: string
          title: Compartment Id
          description: 'Identifier for this Workspace''s encryption compartment. When you configure a

            customer-managed encryption key (CMEK) on AWS, reference this value in your

            KMS key-policy condition so the key is scoped to this compartment. On GCP and

            Azure, Anthropic enforces the compartment binding automatically; you do not

            need to reference this value in your key configuration. See the CMEK integration guide for the

            required key configuration, including the value used during key validation.'
          examples:
          - f8a7b6c5-4d3e-4f1a-8b9c-0d1e2f3a4b5c
        created_at:
          type: string
          format: date-time
          title: Created At
          description: RFC 3339 datetime string indicating when the Workspace was created.
          examples:
          - '2024-10-30T23:58:27.427722Z'
        data_residency:
          $ref: '#/components/schemas/BetaDataResidency'
          description: Data residency configuration.
        display_color:
          type: string
          title: Display Color
          description: Hex color code representing the Workspace in the Anthropic Console.
          examples:
          - '#6C5BB9'
        external_key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: External Key Id
          description: 'ID of the customer-managed encryption key (CMEK) configuration to use for this

            Workspace. Setting this field requires CMEK to be enabled for your

            organization. When set, data stored for this Workspace is encrypted with the

            referenced key. Create key configurations with the External Keys API. This

            field is write-once: once a key is attached to a Workspace it cannot be

            detached or replaced. To rotate key material, rotate the underlying key on

            your cloud KMS; the `external_key_id` stays the same.'
          examples:
          - ekey_01SDCCSbTxrXDpWc1phhtcfK
        id:
          type: string
          title: Id
          description: ID of the Workspace.
          examples:
          - wrkspc_01JwQvzr7rXLA5AGx3HKfFUJ
        name:
          type: string
          title: Name
          description: Name of the Workspace.
          examples:
          - Workspace Name
        tags:
          additionalProperties:
            type: string
          type: object
          title: Tags
          description: User-defined tags as string key-value pairs. Keys may not begin with `anthropic`.
          examples:
          - env: prod
            team: platform
        type:
          type: string
          const: workspace
          title: Type
          description: 'Object type.


            For Workspaces, this is always `"workspace"`.'
          default: workspace
      type: object
      required:
      - archived_at
      - compartment_id
      - created_at
      - data_residency
      - display_color
      - external_key_id
      - id
      - name
      - tags
      - type
      title: Workspace
