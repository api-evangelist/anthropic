        region:
          anyOf:
          - type: string
          - type: 'null'
          title: Region
          description: AWS region. Derived from `kms_arn` if omitted.
          examples:
          - us-east-1
        role_arn:
          anyOf:
          - type: string
          - type: 'null'
          title: Role Arn
          description: IAM role ARN. Deprecated — Anthropic reaches the KMS key via a managed intermediate role; this field is ignored.
          deprecated: true
          examples:
          - arn:aws:iam::111122223333:role/anthropic-cmek
        type:
          type: string
          const: aws
          title: Type
      additionalProperties: false
      type: object
