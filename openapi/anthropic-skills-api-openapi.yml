          examples:
          - '2024-10-30T23:58:27.427722Z'
          title: Created At
          type: string
        description:
          description: 'Description of the skill version.


            This is extracted from the SKILL.md file in the skill upload.'
          examples:
          - A custom skill for doing something useful
          title: Description
          type: string
        directory:
          description: 'Directory name of the skill version.


            This is the top-level directory name that was extracted from the uploaded files.'
          examples:
          - my-skill
          title: Directory
          type: string
        id:
          description: 'Unique identifier for the skill version.


            The format and length of IDs may change over time.'
          examples:
          - skillver_01JAbcdefghijklmnopqrstuvw
          title: Id
          type: string
        name:
          description: 'Human-readable name of the skill version.


            This is extracted from the SKILL.md file in the skill upload.'
          examples:
          - my-skill
          title: Name
          type: string
        skill_id:
          description: Identifier for the skill that this version belongs to.
          examples:
          - skill_01JAbcdefghijklmnopqrstuvw
          title: Skill Id
          type: string
        type:
          default: skill_version
          description: 'Object type.


            For Skill Versions, this is always `"skill_version"`.'
