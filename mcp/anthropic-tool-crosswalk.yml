source: mcp/anthropic-mcp.yml, openapi/*.yml, graphql/anthropic-graphql.md
notes: >-
  This crosswalk is unusual and the shape of the divergence is the finding.
  Anthropic's ONE published first-party MCP server is Claude Code over stdio
  (`claude mcp serve`), whose tools are a coding agent's local file/shell/edit
  toolset — they do NOT front the Claude REST API and therefore bind to NO
  OpenAPI operation. The tools[] in mcp/anthropic-mcp.yml are a DERIVED candidate
  set (status: candidate) showing how the REST API could be exposed over MCP; the
  crosswalk below binds those candidates to their backing operationIds so the
  mapping is auditable if Anthropic ever ships such a server. Every row is marked
  candidate in `binding` for that reason. There is no live MCP schema to
  introspect: `tools/list` was not answerable anonymously on any Anthropic host
  (probed 2026-08-27).
