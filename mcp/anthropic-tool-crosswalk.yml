mcp_only:
- tool: (claude-code stdio toolset)
  reason: >-
    The one server Anthropic actually publishes exposes Claude Code's local tools
    — file read/edit, bash, search, task management — to an MCP client. None of
    these has a public REST equivalent on api.anthropic.com; they act on the
    caller's own machine, not on Anthropic's API. Anthropic does not publish a
    tools/list manifest for it, and it cannot be introspected without running the
    binary locally.
- tool: mcp_connector (Messages API `mcp_servers` parameter)
  reason: >-
    Inverted direction. This is Anthropic acting as an MCP CLIENT — the Messages
    API calls out to third-party remote MCP servers named in the request body
    (beta header mcp-client-2025-04-04). It is not a tool an agent can call on
    Anthropic; it is Anthropic calling tools elsewhere. Only tool calls are
    supported, and local stdio servers cannot be attached.
