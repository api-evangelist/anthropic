- {operations: [getSkill, deleteSkill, listSkillVersions, createSkillVersion, getSkillVersion], reason: Skill read/version lifecycle.}
- {operations: [generatePrompt, improvePrompt, templatizePrompt], reason: Experimental prompt tools.}
