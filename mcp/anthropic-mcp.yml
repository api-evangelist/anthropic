generated: '2026-09-23'
method: derived
status: candidate
source: openapi/*.yml
notes: Anthropic authors and stewards the open Model Context Protocol (modelcontextprotocol.io) and Claude
  consumes remote MCP servers, but Anthropic does not publish an official hosted MCP server that fronts
  its own REST API. The one first-party MCP server Anthropic ships is `claude mcp serve` in Claude Code,
  a local stdio server whose tools operate on the CALLER's machine (files, bash, edit) and bind to no
  REST operation on api.anthropic.com. The tools below are a candidate set derived one-per-operation
  from the repo's OpenAPI specs, illustrating how the Claude API could be exposed over MCP. Managed
  Agents can attach arbitrary third-party MCP servers as tools via the Messages API `mcp_servers`
  parameter (mcp-client-2025-04-04 beta), and organizations can expose internal MCP servers to Claude
  through MCP Tunnels — both are Anthropic acting as an MCP CLIENT, not as an MCP server.
references:
  spec: https://modelcontextprotocol.io
  github: https://github.com/modelcontextprotocol
  managed_agents_mcp: https://platform.claude.com/docs/en/managed-agents/mcp-connector
  remote_mcp_servers: https://platform.claude.com/docs/en/agents-and-tools/remote-mcp-servers
  mcp_tunnels: https://platform.claude.com/docs/en/agents-and-tools/mcp-tunnels/overview
deployment:
