source: >-
  Artifacts already harvested this run (security/anthropic-trust-center.yml,
  security/anthropic-vulnerability-disclosure.yml, lifecycle/anthropic-lifecycle.yml,
  conformance/anthropic-conformance.yml) plus the provider's own published legal and
  privacy documents at trust.anthropic.com/subprocessors, www.anthropic.com/transparency,
  www.anthropic.com/transparency/system-trust-reporting, www.anthropic.com/legal/aup,
  www.anthropic.com/legal/data-processing-addendum, www.anthropic.com/legal/commercial-terms,
  and the Anthropic Privacy Center (privacy.claude.com/en) commercial-customer articles.
checked: '2026-09-23'
harvest_only: true
harvest_only_note: >-
  This file records WHAT Anthropic publishes on the horizontal regulatory layer
  (AI, cyber, accessibility, privacy, product security). It does not decide which
  regimes reach the company — that is the Kin Score regime map's job, not this
  artifact's.
summary: >-
  Anthropic publishes an unusually complete horizontal posture: a public
  Transparency Hub with dated Model Reports and semi-annual System Trust and
  Reporting numbers (banned accounts, appeals, NCMEC / CSAM reporting, legal
  requests), a Trust Center compliance matrix that maps six certifications (SOC 2
  Type II, ISO 27001:2022, ISO/IEC 42001:2023, HIPAA/BAA, CSA STAR, FedRAMP High
  for Claude for Government) across ten product surfaces, a named subprocessor
  list (20+ entries with country and product scope), a Commercial DPA with EU
  Standard Contractual Clauses auto-incorporated, US default data storage with
  documented traffic-routing selection for Claude Developer Platform and
  Enterprise plans, a 30-day default input/output retention window on the API
  with an optional Zero Data Retention agreement for eligible APIs, a
  no-training-on-commercial-inputs default, and a copyright / notice-and-action
  channel. What is absent is an accessibility conformance report (no VPAT, no
  WCAG statement), an SBOM in any format, a Global Privacy Control statement,
  and a per-model long-term support commitment beyond the dated deprecation
  policy already recorded in lifecycle/.
