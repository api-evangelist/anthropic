description: 'Anthropic is an AI safety company and the creator of the Claude family of large language models (Opus, Sonnet, Haiku, and the Fable/Mythos
  frontier line). The Claude Developer Platform exposes them through a single REST API at api.anthropic.com: the Messages API for text, vision,
  tool use, thinking, streaming and structured outputs; Message Batches for asynchronous work at half price; Files, Token Counting, Models, and
  experimental Prompt Tools; Managed Agents with sessions, environments, memory stores, vaults and scheduled deployments; a Skills API; and an
  Admin API for organizations, workspaces, members, invites and API keys. Authentication is x-api-key with a required anthropic-version date header
  and dated anthropic-beta opt-ins. Anthropic also authors two of the open standards the agent ecosystem runs on — the Model Context Protocol
  and the Agent Skills specification — and ships Claude Code, the terminal agentic coding tool, which doubles as a first-party stdio MCP server.'
