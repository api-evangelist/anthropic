notes: >-
  One real document across six hosts: the RFC 9116 security.txt at anthropic.com,
  re-fetched verbatim 2026-08-27 (315 bytes, HackerOne embedded submission
  contact + responsible-disclosure policy). Everything else 404s. The Claude API
  authenticates with x-api-key, not OAuth, so there is no OIDC or RFC 8414
  discovery document on the API host; MCP OAuth discovery is served per remote
  MCP server, not by Anthropic. No api-catalog, no ai-plugin.json, and no A2A
  agent card on any host — see a2a/ (deliberately absent, nothing was authored).
